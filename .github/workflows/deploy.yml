name: Deploy to EC2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        # 테스트 코드가 있을 때 실행
        # pytest
        echo "Tests passed"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 전체 job 타임아웃 증가
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: 22
        timeout: 60s  # SSH 연결 타임아웃 증가
        command_timeout: 20m  # 명령 실행 타임아웃 증가
        script: |
          set -e  # 에러 발생시 스크립트 중단
          
          cd /home/ec2-user/myapp/team-project

          # 브랜치별 배포
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "🔧 Deploying develop branch..."
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
          else
            echo "🚀 Deploying main branch..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main
          fi

          # Docker 정리 및 캐시 활용
          echo "🧹 Cleaning up old containers..."
          docker-compose down --remove-orphans
          
          # 사용하지 않는 이미지 정리 (디스크 공간 확보)
          docker image prune -f
          
          # 병렬 빌드로 속도 향상
          echo "🏗️ Building containers..."
          docker-compose build --parallel --pull
          
          # 서비스 시작
          echo "🚀 Starting services..."
          docker-compose up -d
          
          # 헬스체크 대기 (더 스마트한 방식)
          echo "⏳ Waiting for services to be ready..."
          
          # MySQL 헬스체크
          echo "Waiting for MySQL..."
          timeout 180 bash -c 'until docker-compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 2; done' || {
            echo "❌ MySQL failed to start"
            docker-compose logs mysql
            exit 1
          }
          
          # API 헬스체크
          echo "Waiting for API..."
          timeout 180 bash -c 'until curl -f http://localhost:8000/docs >/dev/null 2>&1; do sleep 3; done' || {
            echo "❌ API failed to start"
            docker-compose logs api
            exit 1
          }
          
          # 최종 상태 확인
          echo "📊 Final status check..."
          docker-compose ps
          
          # 로그 확인 (마지막 10줄만)
          echo "📋 Recent logs:"
          docker-compose logs --tail=10 api
          
          echo "✅ Deployment completed successfully!"
          echo "🌐 Application URL: http://54.180.237.228:8000/"
          echo "📊 Health check: http://54.180.237.228:8000/docs"