version: '3.8'

services:
  # FastAPI 애플리케이션
  api:
    build: .
    container_name: team-api
    ports:
      - "8000:8000"  # 배포는 8000 포트 사용
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 환경 설정
      - ENVIRONMENT=production  # 배포환경은 production
      
      # MySQL 설정
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
      - MYSQL_DATABASE=team_project_db
      
      # 보안 관련 (.env에서 가져오기)
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-change-in-production}
      - FERNET_KEY=${FERNET_KEY:-}
      
      # AWS 설정 (.env에서 가져오기)
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      
      # 기타 설정
      - DEBUG=False  # 배포환경은 False
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./.env:/app/.env:ro
    networks:
      - team-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: team-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_123
      - MYSQL_DATABASE=team_project_db
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
    ports:
      - "3306:3306"  # 배포는 표준 3306 포트
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - team-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin (배포환경에서도 필요시 사용)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: team-phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=team_user
      - PMA_PASSWORD=team_password_123
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - team-network
    restart: unless-stopped
    # 프로덕션에서는 보안상 제거하거나 접근 제한 권장
    profiles:
      - admin

volumes:
  mysql_data:

networks:
  team-network:
    driver: bridge