# --- HTTP 모든 호스트 → HTTPS로 
server {
    listen 80 default_server;
    server_name _;
    return 301 https://challengers.today$request_uri;
}

# --- HTTPS 기본 서버(기본 SNI/IP 접근) → 도메인으로 301
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/challengers.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/challengers.today/privkey.pem;

    return 301 https://challengers.today$request_uri;
}

# --- HTTPS 도메인 서버
server {
    listen 443 ssl;
    server_name challengers.today www.challengers.today;

    ssl_certificate     /etc/letsencrypt/live/challengers.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/challengers.today/privkey.pem;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # API 라우트
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        
        # 과거 IP 도메인 쿠키를 도메인으로 교정
        proxy_cookie_domain 13.209.147.11 challengers.today;
    }

    # 헬스체크
    location = /health { return 301 /health/; }
    location /health/ {
        proxy_pass         http://api:8000/health/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 기본 라우트
    location / {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}