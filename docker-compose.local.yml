version: '3.8'

services:
  # FastAPI 애플리케이션
  api:
    build: .
    container_name: team-api-local
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # 환경 설정
      - ENVIRONMENT=development

      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET}
      - NAVER_MAPS_CLIENT_ID=${NAVER_MAPS_CLIENT_ID}
      - NAVER_MAPS_CLIENT_SECRET=${NAVER_MAPS_CLIENT_SECRET}
      
      # MySQL 설정
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
      - MYSQL_DATABASE=team_project_db
      
      # 보안 관련 (.env에서 가져오기)
      - JWT_SECRET=${JWT_SECRET:-default-dev-secret-change-in-production}
      - FERNET_KEY=${FERNET_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      
      # 소셜 로그인 설정
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_PATH=${GOOGLE_REDIRECT_PATH:-/api/v1/auth/callback/google}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_REDIRECT_PATH=${NAVER_REDIRECT_PATH:-/api/v1/auth/callback/naver}
      
      # URL 설정
      - FRONT_BASE_URL=${FRONT_BASE_URL:-http://localhost:8001}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8001/api/v1}
      - VERIFICATION_LINK_BASE=${VERIFICATION_LINK_BASE:-http://localhost:8001/api/v1}
      - VERIFY_SUCCESS_URL=${VERIFY_SUCCESS_URL:-http://localhost:8001/verify/success}
      - VERIFY_FAIL_URL=${VERIFY_FAIL_URL:-http://localhost:8001/verify/fail}
      # 이메일 인증 사용 및 SMTP 설정(로컬: Mailpit)
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-true}
      - MAIL_FROM=${MAIL_FROM:-no-reply@example.com}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      
      # AWS 설정 (.env에서 가져오기)
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      #toss 설정
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
      
      # 초기 관리자 설정
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@fastteam.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-admin123!@#}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-FastTeam Admin}
      
      # 기타 설정
      - DEBUG=True
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      - team-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: team-mysql-local
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_123
      - MYSQL_DATABASE=team_project_db
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
    networks:
      - team-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 로컬 메일 서버 (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: team-mailpit-local
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - team-network-local
    restart: unless-stopped

volumes:
  mysql_data_local:

networks:
  team-network-local:
    driver: bridge
