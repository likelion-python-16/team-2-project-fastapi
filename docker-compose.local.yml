# (version: '3.8' 줄은 경고만 나니 있어도/없어도 됨)
services:
  api:
    build: .
    container_name: team-api-local
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy

    # ✅ .env 값을 "환경변수"로 주입
    env_file:
      - .env

    # ✅ 비밀 아닌 운영/DB 값만 유지
    environment:
      - ENVIRONMENT=development

      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET}
      - NAVER_MAPS_CLIENT_ID=${NAVER_MAPS_CLIENT_ID}
      - NAVER_MAPS_CLIENT_SECRET=${NAVER_MAPS_CLIENT_SECRET}
      
      # MySQL 설정
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
      - MYSQL_DATABASE=team_project_db

      # ❌ 아래 두 줄은 삭제 (우리 코드는 안 씀)
      # - JWT_SECRET=${JWT_SECRET:-default-dev-secret-change-in-production}
      # - FERNET_KEY=${FERNET_KEY:-}

      # (AWS 값은 필요할 때 .env에도 넣어 사용)
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      # ❌ 이 줄 제거: 파일 마운트만 해서는 env로 주입되지 않음
      # - ./.env:/app/.env:ro

    networks:
      - team-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: team-mysql-local
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_123
      - MYSQL_DATABASE=team_project_db
      - MYSQL_USER=team_user
      - MYSQL_PASSWORD=team_password_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
    networks:
      - team-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  phpmyadmin:                      # 👈 services 아래, api/mysql와 같은 깊이
    image: phpmyadmin/phpmyadmin
    container_name: team-phpmyadmin
    ports:
      - "8080:80"
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql              # 컨테이너끼리는 서비스명
      PMA_PORT: 3306               # 내부 포트
      PMA_ARBITRARY: 1             # (옵션) 로그인 화면에서 임의 호스트 입력 허용
      UPLOAD_LIMIT: 64M
    networks:
      - team-network-local
    restart: unless-stopped

volumes:
  mysql_data_local:

networks:
  team-network-local:
    driver: bridge

