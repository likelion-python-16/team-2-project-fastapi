{% extends "final.html" %}
{% block title %}로그인 - Team Project{% endblock %}
{% block content %}
<div id="pageBg" class="flex items-center justify-center grow">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="signinForm" method="post" novalidate>
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono leading-none mb-2.5">로그인</h3>
        <div class="text-sm text-muted-foreground">
          계정이 없으신가요?
          <a class="link" href="/signup">회원가입</a>
        </div>
      </div>

      <div id="alertContainer" class="hidden"></div>
      <!-- 소셜 로그인 버튼 -->
      <div class="grid grid-cols-2 gap-2.5">
        <a id="btnLoginGoogle" class="kt-btn kt-btn-outline justify-center items-center" href="/api/v1/auth/login/google">
          <img alt="Google" class="size-3.5 shrink-0" src="/static/assets/media/brand-logos/google.svg"><span class="ms-1">구글 로그인</span>
        </a>
        <a id="btnLoginNaver" class="kt-btn kt-btn-outline justify-center items-center" href="/api/v1/auth/login/naver">
          <img alt="Naver" class="size-3.5 shrink-0" src="/static/assets/media/brand-logos/naver.svg"><span class="ms-1">네이버 로그인</span>
        </a>
      </div>
      <div class="text-center my-2 text-sm text-muted-foreground">또는</div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">아이디</label>
        <input class="kt-input" id="username" name="username" placeholder="아이디 또는 이메일" autocomplete="username" required />
      </div>

      <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between gap-1">
          <label class="kt-form-label font-normal text-mono">비밀번호</label>
        </div>
        <div class="kt-input">
          <input id="password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
          <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon bg-transparent! -me-1.5" type="button" id="btnTogglePw" aria-label="비밀번호 보기 전환">
            <i class="ki-filled ki-eye text-muted-foreground" id="iconShow"></i>
            <i class="ki-filled ki-eye-slash text-muted-foreground hidden" id="iconHide"></i>
          </button>
        </div>
        <!-- 계정 찾기/로그인 유지 → 한 행에 배치 -->
        <div class="flex items-center justify-between mt-1">
          <button type="button" id="btnFindOpen" class="text-sm kt-link">
            아이디 찾기 · 비밀번호 찾기
          </button>
          <label class="kt-label m-0 flex items-center gap-2">
            <input class="kt-checkbox kt-checkbox-sm" id="rememberMe" type="checkbox" value="1" />
            <span class="kt-checkbox-label">로그인 상태 유지</span>
          </label>
        </div>
      </div>

      <button class="kt-btn kt-btn-primary flex justify-center" id="btnSignIn" type="submit">
        <span id="btnText">로그인</span>
        <span id="btnLoading" class="hidden"><i class="ki-filled ki-spinner animate-spin me-2"></i>로그인 중...</span>
      </button>
    </form>
  </div>
</div>

<script>
// 배경 이미지는 사용하지 않음 (요청에 따라 제거)

function showAlert(message, type) {
  const el = document.getElementById('alertContainer');
  const css = type === 'error' ? 'kt-alert-danger' : 'kt-alert-success';
  el.innerHTML = `
    <div class="kt-alert ${css} p-3 rounded-lg flex items-center gap-2">
      <i class="ki-filled ${type==='error'?'ki-information-2':'ki-check'}"></i>
      <span class="text-sm">${message}</span>
    </div>`;
  el.classList.remove('hidden');
}

// 이메일 변경 후 리다이렉트되어 온 경우 안내 배너 표시
(function showEmailChangedNotice(){
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('email_changed') === '1') {
      const sentTo = params.get('sent_to') || '';
      const msg = `이메일이 변경되었고 인증 메일을 ${sentTo ? sentTo + '로 ' : ''}보냈습니다. 스팸함도 확인해 주세요.`;
      showAlert(msg, 'success');
      // 한번만 보이도록 쿼리스트링 제거
      const url = new URL(window.location.href);
      url.search = '';
      window.history.replaceState({}, '', url.toString());
    }
  } catch (_) {}
})();

// 딥링크: /login?find=pw|id&u=<username> 로 모달 바로 열기/프리필
(function deepLinkToFind(){
  try{
    const params = new URLSearchParams(location.search);
    const find = (params.get('find')||'').toLowerCase();
    const u = (params.get('u')||'').trim();
    if(u){ try{ document.getElementById('username').value = u; }catch(_){} }
    if(find === 'pw'){
      // 열기 약간 지연해 DOM 이벤트 바인딩 이후 실행
      setTimeout(()=>{
        if(u){ const fpu=document.getElementById('fp_username'); if(fpu) fpu.value=u; }
        if(typeof openDlg==='function') openDlg('dlgFindPw');
      }, 0);
    } else if(find === 'id'){
      setTimeout(()=>{ if(typeof openDlg==='function') openDlg('dlgFindId'); }, 0);
    }
  }catch(_){ }
})();

// 소셜 버튼: 추가 선택지 없이 공급자 동의 화면으로 이동합니다.

(function pwToggle(){
  const btn = document.getElementById('btnTogglePw');
  const input = document.getElementById('password');
  const iconShow = document.getElementById('iconShow');
  const iconHide = document.getElementById('iconHide');
  btn.addEventListener('click', ()=>{
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    iconShow.classList.toggle('hidden', !isPwd);
    iconHide.classList.toggle('hidden', isPwd);
  });
})();

// 사전 동의 안내는 제거하고, 동의 후(콜백/온보딩 단계)에서 안내합니다.

document.getElementById('signinForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('btnSignIn');
  const btnText = document.getElementById('btnText');
  const btnLoading = document.getElementById('btnLoading');

  const username = (document.getElementById('username').value || '').trim().toLowerCase();
  const password = (document.getElementById('password').value || '');
  try { localStorage.setItem('last_login', username); } catch(_) {}

  if (!username || !password) {
    showAlert('아이디와 비밀번호를 입력해 주세요.', 'error');
    return;
  }

  // 이전 토큰은 일단 비움(의도치 않은 자동 로그인 방지)
  try{ localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); sessionStorage.removeItem('access_token'); sessionStorage.removeItem('refresh_token'); }catch(_){}

  btn.disabled = true; btnText.classList.add('hidden'); btnLoading.classList.remove('hidden');

  const endpoints = ['/api/v1/auth/login', '/auth/login'];
  let ok = false, data = null, lastStatus = 0, lastDetail = null;

  for (const url of endpoints) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: username, password })
      });
      lastStatus = res.status;
      let body = null; try { body = await res.json(); } catch (_) {}
      if (res.ok) { data = body; ok = true; break; }
      lastDetail = body && (body.detail || body.message || body);
      if (res.status === 403) break;
    } catch (_) {}
  }

  if (!ok) {
    const isUnverified =
      lastStatus === 403 && lastDetail &&
      (lastDetail.code === 'EMAIL_NOT_VERIFIED' ||
       lastDetail === '이메일 인증이 필요합니다.' ||
       (typeof lastDetail === 'string' && lastDetail.includes('이메일 인증')));

    if (isUnverified) {
      const alert = document.getElementById('alertContainer');
      alert.innerHTML = `
        <div class="kt-alert kt-alert-danger p-3 rounded-lg flex flex-col gap-3">
          <div class="flex items-center gap-2">
            <i class="ki-filled ki-information-2"></i>
            <span class="text-sm">이메일 인증이 필요합니다.
              <span id="remainText" class="ms-1 text-xs text-muted-foreground"></span>
            </span>
          </div>
          <div class="flex items-center gap-2">
            <div class="text-sm text-muted-foreground flex-1">스팸함에도 수신한 이메일이 없다면 재전송 버튼을 눌러주세요.</div>
            <button class="kt-btn kt-btn-sm kt-btn-primary" id="btnResend">재전송</button>
          </div>
          <div class="flex items-center gap-2">
            <div class="text-sm text-muted-foreground flex-1">다른 이메일로 수정하고 인증 이메일을 받고 싶다면 이메일 수정 버튼을 눌러주세요.</div>
            <a class="kt-btn kt-btn-sm kt-btn-primary" href="/account/email">이메일 수정</a>
          </div>
        </div>`;
      alert.classList.remove('hidden');

      // 남은 시간 표시 (login 파라미터 사용)
      try {
        const r = await fetch(`/api/v1/auth/verify-remaining?login=${encodeURIComponent(username)}`);
        const j = await r.json();
        const s0 = (j && j.seconds_left) ? j.seconds_left : 0;
        const el = document.getElementById('remainText');
        if (s0 > 0) {
          let left = s0;
          const tick = () => {
            const m = Math.floor(left/60), sec = left%60;
            el.textContent = `(남은 시간: ${m}분 ${sec}초)`;
            if (left > 0) { left--; setTimeout(tick, 1000); }
          };
          tick();
        } else {
          el.textContent = '';
        }
      } catch(_) {}

      // 재전송 (아이디/이메일 값 그대로 보냄)
      document.getElementById('btnResend').addEventListener('click', async ()=>{
        const resendEndpoints = ['/api/v1/auth/send-verification-by-login', '/auth/send-verification-by-login'];
        let sent = false;
        for (const url of resendEndpoints) {
          try {
            const r = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ login: username })
            });
            if (r.ok) { sent = true; break; }
          } catch (_) {}
        }
        if (sent) showAlert('인증 메일이 재전송되었습니다. 메일함을 확인해 주세요.', 'success');
        else showAlert('재전송에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'error');
      });

    } else {
      showAlert('로그인에 실패했습니다. 아이디 또는 비밀번호를 확인해 주세요.', 'error');
    }
  } else {
    // 성공으로 간주하려면 토큰이 반드시 있어야 함
    if (data && data.access_token) {
      const remember = document.getElementById('rememberMe').checked;
      const store = remember ? localStorage : sessionStorage;
      const other = remember ? sessionStorage : localStorage;
      try {
        other.removeItem('access_token'); other.removeItem('refresh_token'); other.removeItem('remember_login');
        store.setItem('access_token', data.access_token);
        if (data.refresh_token) store.setItem('refresh_token', data.refresh_token);
        if (remember) localStorage.setItem('remember_login', '1');
      } catch(_) {}
      window.location.href = '/home';
    } else {
      showAlert('로그인에 실패했습니다. 다시 시도해 주세요.', 'error');
    }
  }

  btn.disabled = false; btnText.classList.remove('hidden'); btnLoading.classList.add('hidden');
});
</script>

<!-- 소셜 사전 안내 모달은 사용하지 않습니다. -->

<!-- ===== 아이디/비밀번호 찾기 모달 ===== -->
<style>
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10000}
  .modal{background:#fff;border-radius:12px;width:min(92vw,420px);box-shadow:0 10px 30px rgba(0,0,0,.2)}

<div id="dlgFindId" class="modal-backdrop">
  <div class="modal">
    <div class="hd">아이디 찾기 <button type="button" id="xFindId">✕</button></div>
    <div class="bd">
      <div class="field"><label>이름</label><input id="fi_name" placeholder="예: 홍길동"></div>

      <div class="error-text" id="fi_ident_err"></div>
      <div class="field"><label>연락처</label><input id="fi_contact" placeholder="예: 010-1234-5678" maxlength="13"></div>

      <div class="field"><label>이메일</label><input id="fi_email" placeholder="예: mail@example.com"></div>

    </div>
  </div>
  </div>

<div id="dlgFindPw" class="modal-backdrop">
  <div class="modal">
    <div class="hd">비밀번호 찾기 <button type="button" id="xFindPw">✕</button></div>
    <div class="bd">
      <div class="field"><label>아이디</label><input id="fp_username" placeholder="가입한 아이디"></div>
      <div class="error-text" id="fp_username_err"></div>
      <div class="field"><label>이름</label><input id="fp_name" placeholder="예: 홍길동"></div>
      <div class="error-text" id="fp_name_err"></div>
      <div class="field"><label>주민번호</label><input id="fp_ident" placeholder="예: 900101-1234567" maxlength="14"></div>
      <div class="error-text" id="fp_ident_err"></div>
      <div class="field"><label>등록 이메일</label><input id="fp_email" placeholder="가입 시 사용한 이메일"></div>
      <div class="error-text" id="fp_email_err"></div>
      <div id="fp_msg" class="text-sm"></div>
    </div>
    <div class="ft">
      <button class="kt-btn" id="fp_cancel" type="button">취소</button>
      <button class="kt-btn kt-btn-primary" id="fp_ok" type="button">확인</button>
    </div>
  </div>
</div>

<!-- 계정 찾기 선택 모달 -->
<div id="dlgFindSelect" class="modal-backdrop">
  <div class="modal">
    <div class="hd">계정 찾기 <button type="button" id="xFindSel">✕</button></div>
    <div class="bd">
      <div class="flex flex-col gap-3">
        <button class="kt-btn kt-btn-primary" id="selFindId" type="button">아이디 찾기</button>
        <button class="kt-btn" id="selFindPw" type="button">비밀번호 찾기</button>
      </div>
    </div>
    <div class="ft">
      <button class="kt-btn" id="selClose" type="button">닫기</button>
    </div>
  </div>
  </div>

<div id="dlgResetPw" class="modal-backdrop">
  <div class="modal">
    <div class="hd">새 비밀번호 설정 <button type="button" id="xResetPw">✕</button></div>
    <div class="bd">
      <div class="field"><label>새 비밀번호</label><input id="rp_pw" type="password" placeholder="새 비밀번호"></div>
      <div class="field"><label>비밀번호 확인</label><input id="rp_pw2" type="password" placeholder="다시 입력"></div>
      <div class="text-xs text-muted-foreground">8자 이상, 대/소문자, 숫자, 특수문자 포함</div>
      <div id="rp_msg" class="text-sm"></div>
    </div>
    <div class="ft">
      <button class="kt-btn" id="rp_cancel" type="button">취소</button>
      <button class="kt-btn kt-btn-primary" id="rp_ok" type="button">변경</button>
    </div>
  </div>
</div>

<script>
// 공통 메시지 유틸
function msgify(v){
  if (v == null) return '요청에 실패했습니다.';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch(_) { return String(v); }
}

// 모달 유틸
function openDlg(id){ document.getElementById(id).style.display='flex'; }
function closeDlg(id){ document.getElementById(id).style.display='none'; }

// 아이디/비밀번호 찾기 선택 모달 열기
document.getElementById('btnFindOpen').addEventListener('click', ()=>{ openDlg('dlgFindSelect'); });
document.getElementById('xFindId').addEventListener('click', ()=> closeDlg('dlgFindId'));
document.getElementById('fi_cancel').addEventListener('click', ()=> closeDlg('dlgFindId'));
// 즉시 포맷/검증 바인딩
const __fi_ident = document.getElementById('fi_ident');
const __fi_contact = document.getElementById('fi_contact');
const __fi_email = document.getElementById('fi_email');
const __err_ident = document.getElementById('fi_ident_err');
const __err_contact = document.getElementById('fi_contact_err');
const __err_email = document.getElementById('fi_email_err');

__fi_ident?.addEventListener('input', ()=>{
  const v = formatIdentification(__fi_ident.value);
  __fi_ident.value = v;
  const ok = /^\d{6}-\d{1,7}$/.test(v) && isValidRRN13(v.replace(/\D/g,''));
  __err_ident.textContent = ok ? '' : '주민번호 형식이 올바르지 않습니다.';
});
__fi_contact?.addEventListener('input', ()=>{
  const v = formatPhoneOnInput010(__fi_contact.value);
  __fi_contact.value = v;
  const norm = normalizePhoneForSave010(v);
  __err_contact.textContent = (v && !norm) ? '전화번호는 010으로 시작하는 11자리여야 합니다.' : '';
});
__fi_email?.addEventListener('input', ()=>{
  const v = (__fi_email.value||'').trim();
  __err_email.textContent = (v && !isValidEmailStrict(v)) ? '이메일 형식이 올바르지 않습니다.' : '';
});

document.getElementById('fi_ok').addEventListener('click', async ()=>{
  const name = document.getElementById('fi_name').value.trim();
  let ident = document.getElementById('fi_ident').value.trim();
  let phone = document.getElementById('fi_contact').value.trim();
  let email = document.getElementById('fi_email').value.trim();
  const msg = document.getElementById('fi_msg');
  msg.textContent='';
  if(!name || !ident || (!phone && !email)){ msg.textContent='이름/주민번호와 연락처 또는 이메일을 입력해 주세요.'; return; }
  // 가입 규칙 적용
  ident = formatIdentification(ident);
  const d13 = ident.replace(/\D/g,'');
  if(!isValidRRN13(d13)){ msg.textContent='주민번호 형식이 올바르지 않습니다.'; return; }
  let contact = '';
  if (email) {
    if(!isValidEmailStrict(email)){ msg.textContent='이메일 형식이 올바르지 않습니다.'; return; }
    contact = email.trim();
  } else {
    phone = formatPhoneOnInput010(phone);
    const norm = normalizePhoneForSave010(phone);
    if(!norm){ msg.textContent='전화번호는 010으로 시작하는 11자리여야 합니다.'; return; }
    contact = norm;
  }
  try{
    const r = await fetch('/api/v1/auth/find-username', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, identification: ident, contact }) });
    const j = await r.json();
    if(r.ok){ alert(`아이디: ${j.username}`); closeDlg('dlgFindId'); }
    else{ alert('해당 정보를 가진 계정은 없습니다.'); }
  }catch(_){ alert('조회에 실패했습니다.'); }
});

// 비밀번호 찾기 (메일 발송)
document.getElementById('xFindPw').addEventListener('click', ()=> closeDlg('dlgFindPw'));
document.getElementById('fp_cancel').addEventListener('click', ()=> closeDlg('dlgFindPw'));
document.getElementById('fp_ok').addEventListener('click', async ()=>{
  const username = document.getElementById('fp_username').value.trim();
  const name = document.getElementById('fp_name').value.trim();
  let ident = document.getElementById('fp_ident').value.trim();
  const email = document.getElementById('fp_email').value.trim();
  const msg = document.getElementById('fp_msg');
  msg.textContent = '';
  // 즉시 검증(회원가입과 동일 기준)
  const uErr = document.getElementById('fp_username_err');
  const nErr = document.getElementById('fp_name_err');
  const iErr = document.getElementById('fp_ident_err');
  const eErr = document.getElementById('fp_email_err');
  uErr.textContent = nErr.textContent = iErr.textContent = eErr.textContent = '';

  // 사용자명: 영문 시작, 영문/숫자/_ 3~50자
  if(!/^[A-Za-z][A-Za-z0-9_]{2,49}$/.test(username)){ uErr.textContent='사용자명은 영문으로 시작, 영문/숫자/_ 3~50자입니다.'; }
  // 이름: 2자 이상
  if(!name || name.trim().length < 2){ nErr.textContent='이름은 2자 이상이어야 합니다.'; }
  // 주민번호: 포맷/13자리
  ident = formatIdentification(ident); document.getElementById('fp_ident').value = ident;
  const d13 = ident.replace(/\D/g,'');
  if(!isValidRRN13(d13)){ iErr.textContent='주민번호 형식이 올바르지 않습니다.'; }
  // 이메일 형식
  if(!isValidEmailStrict(email)){ eErr.textContent='이메일 형식이 올바르지 않습니다.'; }

  if(uErr.textContent || nErr.textContent || iErr.textContent || eErr.textContent){ msg.textContent='입력값을 확인해 주세요.'; return; }
  try{
    const r = await fetch('/api/v1/auth/request-password-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, name, identification: ident, email }) });
    const j = await r.json();
    if(r.ok){
      msg.textContent = '이메일을 보냈습니다. 받은 메일에서 비밀번호 재설정 버튼을 눌러 주세요.';
    }else{
      const txt = j && (j.detail || j.message) ? msgify(j.detail || j.message) : '요청에 실패했습니다.';
      alert(txt);
    }
  }catch(e){ alert(msgify(e && e.message)); }
});

// 비밀번호 찾기: 주민번호 자동 하이픈/검증
const __fp_ident = document.getElementById('fp_ident');
const __fp_ident_err = document.getElementById('fp_ident_err');
__fp_ident?.addEventListener('input', ()=>{
  const v = formatIdentification(__fp_ident.value);
  __fp_ident.value = v;
  const ok = /^\d{6}-\d{1,7}$/.test(v) && isValidRRN13(v.replace(/\D/g,''));
  if (__fp_ident_err) __fp_ident_err.textContent = ok ? '' : '주민번호 형식이 올바르지 않습니다.';
});

// 링크로 돌아왔을 때 reset_token 처리 → 새 비밀번호 모달 띄움
(function handleResetToken(){
  try{
    const params = new URLSearchParams(location.search);
    const t = params.get('reset_token');
    if(!t) return;
    openDlg('dlgResetPw');
    document.getElementById('rp_ok').onclick = async ()=>{
      const p1 = document.getElementById('rp_pw').value;
      const p2 = document.getElementById('rp_pw2').value;
      const m = document.getElementById('rp_msg'); m.textContent='';
      if(p1 !== p2){ m.textContent='비밀번호가 일치하지 않습니다'; return; }
      try{
        const r = await fetch('/api/v1/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: t, new_password: p1 }) });
        const j = await r.json();
        if(r.ok){ alert('비밀번호가 변경되었습니다. 이제 로그인해 주세요.'); closeDlg('dlgResetPw'); const url = new URL(location.href); url.search = ''; history.replaceState({}, '', url.toString()); }
        else { m.textContent = (j.detail || '변경에 실패했습니다'); }
      }catch(_){ m.textContent='변경에 실패했습니다'; }
    };
    document.getElementById('xResetPw').onclick = ()=> closeDlg('dlgResetPw');
    document.getElementById('rp_cancel').onclick = ()=> closeDlg('dlgResetPw');
  }catch(_){ }
})();

// ===== 가입과 동일한 유효성 유틸 =====
function isValidEmailStrict(email){
  const re=/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i; return re.test(email);
}
function formatPhoneOnInput010(v){
  const d=String(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length<=3) return d; if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}
function normalizePhoneForSave010(raw){
  if(!raw) return null; const d=String(raw).replace(/\D/g,'');
  if(!/^010\d{8}$/.test(d)) return null; return '010-'+d.slice(3,7)+'-'+d.slice(7,11);
}
function formatIdentification(v){
  let n=String(v||'').replace(/\D/g,'').slice(0,13); if(n.length<=6) return n; return n.replace(/(\d{6})(\d{1,7})/,'$1-$2');
}
function isValidRRN13(n13){
  if(!/^\d{13}$/.test(n13)) return false; const m=parseInt(n13.slice(2,4),10), d=parseInt(n13.slice(4,6),10);
  if(!/[01]/.test(n13[2])) return false; if(!/[0-3]/.test(n13[4])) return false; if(!(m>=1&&m<=12)) return false; if(!(d>=1&&d<=31)) return false; if(!/[1-8]/.test(n13[6])) return false; return true;
}

// 새 비밀번호 규칙 검증 헬퍼
function validatePasswordStrength(pw){
  if(!pw||pw.length<8) return false; const u=/[A-Z]/.test(pw), l=/[a-z]/.test(pw), d=/\d/.test(pw), s=/[!@#$%^&*(),.?":{}|<>]/.test(pw); return u&&l&&d&&s;
}
// 새 비밀번호 입력 실시간 검증
(function(){
  const p1=document.getElementById('rp_pw'); const p2=document.getElementById('rp_pw2'); const m=document.getElementById('rp_msg');
  if(!p1||!p2||!m) return;
  function repaint(){
    m.textContent=''; const a=p1.value, b=p2.value;
    if(a && !validatePasswordStrength(a)) m.textContent='비밀번호 규칙(8자 이상, 대/소문자, 숫자, 특수문자)을 만족해 주세요.';
    else if(b && a!==b) m.textContent='비밀번호가 일치하지 않습니다.';
  }
  p1.addEventListener('input', repaint); p2.addEventListener('input', repaint);
})();
</script>
