<style>
  /* Welcome Modal (partial) */
  .kt-modal {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease}
  .kt-modal.show {opacity: 1; visibility: visible}
  .kt-modal-content {background:#fff; border-radius:16px; box-shadow:0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04); max-width:500px; width:90%; max-height:90vh; overflow:hidden; transform:scale(.9); transition: transform .3s ease}
  .kt-modal.show .kt-modal-content {transform:scale(1)}
  .kt-modal-header {display:flex; justify-content:flex-end; padding:20px 20px 0}
  .kt-modal-body {display:flex; flex-direction:column; align-items:center; padding:0 40px 40px; text-align:center}
  .welcome-illustration {margin-bottom:40px; width:140px; height:140px; background:linear-gradient(135deg,#4338ca,#6366f1); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:48px; color:#fff; font-weight:bold}
  .welcome-title {font-size:24px; font-weight:600; color:#111827; margin-bottom:12px}
  .welcome-subtitle {font-size:16px; color:#6b7280; margin-bottom:28px; line-height:1.5}
  .welcome-actions {display:flex; justify-content:center; gap:12px; margin-bottom:12px}
  .skip-link {font-size:14px; color:#6b7280; text-decoration:none; padding:12px}
  .skip-link:hover {color:#4338ca}
  .kt-btn {display:inline-flex; align-items:center; justify-content:center; padding:8px 16px; border-radius:8px; font-weight:600; font-size:14px; text-decoration:none; cursor:pointer; transition:all .2s ease; border:1px solid transparent}
  .kt-btn-primary {background:#4338ca; color:#fff; border-color:#4338ca}
  .kt-btn-primary:hover {background:#3730a3; border-color:#3730a3}
  .kt-btn-outline {background:#fff; border:1px solid #e5e7eb; color:#6b7280}
  .kt-btn-outline:hover {background:#f9fafb; border-color:#d1d5db}
  .kt-btn-sm {padding:6px 12px; font-size:13px}
  .kt-btn-icon {padding:8px; width:32px; height:32px}
  @media (max-width: 640px) { .kt-modal-content{width:95%; margin:20px} .kt-modal-body{padding:0 20px 30px} .welcome-title{font-size:20px} .welcome-subtitle{font-size:14px} .welcome-actions{flex-direction:column; width:100%} .kt-btn{width:100%; justify-content:center} }
</style>
<div class="kt-modal" id="modal_welcome_message" data-backhref="{{ modal_back_href or '/home' }}">
  <div class="kt-modal-content">
    <div class="kt-modal-header">
      <button class="kt-btn kt-btn-sm kt-btn-icon kt-btn-outline" onclick="closeWelcomeModal()">✕</button>
    </div>
    <div class="kt-modal-body">
      <div class="welcome-illustration">🎯</div>
      <h3 class="welcome-title">Welcome to Challengers</h3>
      <div class="welcome-subtitle">Ready to make Challengers better?<br/>Let's build something amazing together.</div>
      <div class="welcome-actions">
        <a class="kt-btn kt-btn-primary" id="wm_get_started" href="{{ modal_back_href or '/home' }}">Let's Get Started</a>
      </div>
      <a class="skip-link" id="wm_skip" href="{{ modal_back_href or '/home' }}">Skip the tour</a>
    </div>
  </div>
  </div>
<script>
  (function(){
    const KEY = 'kt_welcome_modal_skipped';
    function show(){ const m=document.getElementById('modal_welcome_message'); if(m){ m.classList.add('show'); document.body.style.overflow='hidden'; } }
    function close(){ const m=document.getElementById('modal_welcome_message'); if(m){ m.classList.remove('show'); document.body.style.overflow=''; } }
    function skipAndGo(){
      try{ localStorage.setItem(KEY, '1'); }catch(_){ }
      const m=document.getElementById('modal_welcome_message');
      const back = m ? (m.getAttribute('data-backhref') || '/home') : '/home';
      window.location.href = back;
    }
    window.showWelcomeModal = show; window.closeWelcomeModal = close;
    // auto show only if not skipped before
    try{
      const shouldShow = (function(){ try{ return localStorage.getItem(KEY) !== '1'; }catch(_){ return true; } })();
      if(document.readyState==='complete') { if(shouldShow) show(); }
      else { window.addEventListener('load', ()=>{ if(shouldShow) show(); }); }
    }catch(_){ }
    try{ const m=document.getElementById('modal_welcome_message'); if(m) m.addEventListener('click', (e)=>{ if(e.target===m) close(); }); }catch(_){ }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    // buttons
    try{
      const gs = document.getElementById('wm_get_started');
      const sk = document.getElementById('wm_skip');
      // Get Started: mark skipped and navigate
      if(gs){ gs.addEventListener('click', function(e){ e.preventDefault(); skipAndGo(); }); }
      // Skip: behave like X (just close, no navigation, no skip flag)
      if(sk){ sk.addEventListener('click', function(e){ e.preventDefault(); close(); }); }
    }catch(_){ }
  })();
</script>
