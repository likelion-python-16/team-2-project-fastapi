{% extends "admin_base.html" %}
{% block title %}관리자 승인 대기 - Team Project{% endblock %}
{% block content %}
<style> body { flex-direction: column; } </style>
<div class="flex items-center justify-center grow">
  <div class="kt-card max-w-[520px] w-full mt-12">
    <div class="kt-card-content p-8 text-center">
      <h2 class="text-xl font-semibold mb-2">관리자 승인 대기</h2>
      <p class="text-muted-foreground">관리자 권한 요청이 접수되었습니다. 마스터 관리자의 승인이 완료되면 접속이 가능합니다.</p>
      <p class="text-sm text-muted-foreground mt-2">보안을 위해 잠시 후 자동으로 홈으로 이동하며, 로그인 정보는 모두 정리됩니다.</p>
      <div class="mt-6 flex items-center justify-center gap-2">
        <a class="kt-btn" href="/admin/login">다른 계정으로 관리자 로그인</a>
        <a class="kt-btn kt-btn-primary" href="/logout-all">지금 홈으로 이동</a>
      </div>
    </div>
  </div>
</div>
<script>
// 자동 로그아웃 후 홈으로 이동 (2.5초 딜레이)
setTimeout(function(){
  window.location.replace('/logout-all');
}, 2500);
</script>
{% endblock %}
