<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>리뷰 리스트</title>
  <style>
    :root{
      --line:#E5E7EB; --text:#111827; --primary:#4338CA; --ok:#059669; --muted:#6b7280;
      --brand:#181C32;
    }
    body{ margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:var(--text); background:#fff; }

    /* 헤더 */
    .header-bar{border-bottom:1px solid var(--line); background:#fff;}
    .container{ max-width:1200px; margin:0 auto; padding:0 16px; }
    .header-inner{display:flex; align-items:center; gap:16px; padding:12px 0;}
    .brand{display:flex; align-items:center; gap:10px; color:var(--brand); font-weight:800; letter-spacing:.2px;}
    .brand .dot{color:#9CA3AF; font-weight:700;}

    /* 본문 */
    h1{ font-size:22px; font-weight:800; margin:18px 0; }
    .grid{ display:grid; gap:18px; }
    @media (min-width:1024px){ .grid{ grid-template-columns:repeat(3,1fr); } }
    @media (min-width:768px) and (max-width:1023px){ .grid{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:767px){ .grid{ grid-template-columns:1fr; } }

    .card{ border:1px solid var(--line); border-radius:14px; background:#fff; transition:transform .12s ease, box-shadow .12s ease; position:relative; }
    .card:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .body{ padding:22px; text-align:center; }

    /* 아바타 */
    .avatar-box{ position:relative; width:96px; height:96px; margin:0 auto; }
    .avatar{ width:96px; height:96px; border-radius:50%; border:1px solid var(--line); object-fit:cover; background:#f8fafc; display:block; }
    .avatar-initial{
      width:96px; height:96px; border-radius:50%; display:grid; place-items:center;
      font-weight:800; font-size:28px; color:#fff; user-select:none; border:1px solid var(--line);
    }

    .name{ font-weight:700; margin-top:10px; }
    .sub{ color:var(--muted); font-size:12px; margin-top:6px; }

    .btn{ display:inline-flex; align-items:center; justify-content:center; min-width:120px; height:40px; padding:0 14px;
          border-radius:10px; border:1px solid var(--line); font-weight:700; text-decoration:none; }
    .btn-primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn-done{ background:#ecfdf5; color:#065f46; border-color:#99f6e4; cursor:default; }
    
    /* 신고 버튼 */
    .report-menu{ position:absolute; top:12px; right:12px; z-index:10; }
    .report-toggle{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff;
                   display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; color:var(--muted); }
    .report-toggle:hover{ background:#f9fafb; color:var(--text); }
    
    .report-dropdown{ position:absolute; top:100%; right:0; min-width:160px; background:#fff; border:1px solid var(--line);
                     border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.12); display:none; z-index:20; }
    .report-dropdown.show{ display:block; }
    .report-item{ display:block; width:100%; padding:10px 14px; border:0; background:transparent; text-align:left;
                 font-size:14px; color:var(--text); cursor:pointer; }
    .report-item:hover{ background:#f3f4f6; }
    .report-item:first-child{ border-radius:8px 8px 0 0; }
    .report-item:last-child{ border-radius:0 0 8px 8px; }
    
    /* 신고 모달 */
    .modal-overlay{ position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:1000; display:none; }
    .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:400px; 
           background:#fff; border-radius:12px; padding:24px; z-index:1001; }
    .modal h3{ margin:0 0 16px; font-size:18px; font-weight:700; }
    .modal textarea{ width:100%; height:80px; padding:10px; border:1px solid var(--line); border-radius:8px; 
                    font-family:inherit; resize:vertical; }
    .modal-actions{ display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
    .modal-btn{ padding:8px 16px; border-radius:6px; border:1px solid var(--line); font-weight:600; cursor:pointer; }
    .modal-btn.cancel{ background:#fff; }
    .modal-btn.submit{ background:var(--primary); color:#fff; border-color:var(--primary); }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header class="header-bar">
    <div class="container">
      <div class="header-inner">
        <div class="brand">
          <span>Metronic</span>
          <span class="dot">·</span>
          <a href="/mypage">MyPage</a>
        </div>
      </div>
    </div>
  </header>

  <!-- 본문 -->
  <div class="container">
    <h1>{{ challenge_title or 'Challenge' }}</h1>

    <div class="grid">
      {% for m in members %}
      <div class="card" data-user-id="{{ m.id }}">
        <!-- 신고 메뉴 -->
        <div class="report-menu">
          <button class="report-toggle" data-user-id="{{ m.id }}" title="신고하기">⋮</button>
          <div class="report-dropdown">
            <button class="report-item" data-reason="inappropriate_behavior">부적절한 행동</button>
            <button class="report-item" data-reason="spam">스팸/광고</button>
            <button class="report-item" data-reason="harassment">괴롭힘</button>
            <button class="report-item" data-reason="fake_profile">가짜 프로필</button>
            <button class="report-item" data-reason="other">기타</button>
          </div>
        </div>

        <div class="body">
          <div class="avatar-box" data-name="{{ m.name }}">
            {% if m.avatar_url %}
              <img class="avatar" src="{{ m.avatar_url }}" alt="{{ m.name }} avatar">
            {% else %}
              <!-- URL이 없으면 바로 배지 렌더 -->
              <div class="avatar-initial">{{ m.name[0] }}</div>
            {% endif %}
          </div>

          <div class="name">{{ m.name }}</div>
          <div class="sub">TEAM</div>

          <div style="margin-top:14px;" class="review-button-container" data-user-id="{{ m.id }}">
            <a class="btn btn-primary review-write-btn"
               href="/api/reviews/write?user_id={{ m.id }}&challenge_id={{ challenge_id or 1 }}">
              리뷰 쓰기
            </a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- 신고 모달 -->
  <div id="reportModal" class="modal-overlay">
    <div class="modal">
      <h3>신고하기</h3>
      <p id="reportTarget"></p>
      <textarea id="reportDetails" placeholder="신고 사유에 대한 상세 설명을 입력해주세요..."></textarea>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeReportModal()">취소</button>
        <button class="modal-btn submit" onclick="submitReport()">신고하기</button>
      </div>
    </div>
  </div>

  <!-- 아바타: 이미지 실패 시 이니셜 배지로 대체 + 이름 기반 색상 -->
  <script>
    (function () {
      const palette = [
        "#3b82f6","#10b981","#ef4444","#f59e0b","#8b5cf6",
        "#14b8a6","#0ea5e9","#f97316","#22c55e","#e11d48"
      ];

      function colorFor(name){
        let h = 0;
        for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
        return palette[h % palette.length];
      }

      document.querySelectorAll(".avatar-box").forEach(box => {
        const name = (box.dataset.name || "").trim();
        const img  = box.querySelector("img.avatar");

        // 이미지가 있는 경우: 에러 시 배지로 교체
        if (img) {
          img.addEventListener("error", () => {
            const badge = document.createElement("div");
            badge.className = "avatar-initial";
            badge.textContent = name.charAt(0);
            badge.style.background = colorFor(name);
            img.replaceWith(badge);
          });
        } else {
          // 이미 배지로 렌더된 경우: 색상만 적용
          const badge = box.querySelector(".avatar-initial");
          if (badge) badge.style.background = colorFor(name);
        }
      });
    })();

    // 신고 기능 JavaScript
    let currentReportData = { userId: null, reason: null };

    // 드롭다운 토글 기능
    document.addEventListener('click', function(e) {
      // 신고 메뉴 토글
      if (e.target.matches('.report-toggle')) {
        e.stopPropagation();
        const dropdown = e.target.nextElementSibling;
        const isShowing = dropdown.classList.contains('show');
        
        // 모든 드롭다운 닫기
        document.querySelectorAll('.report-dropdown').forEach(d => d.classList.remove('show'));
        
        // 현재 드롭다운 토글
        if (!isShowing) {
          dropdown.classList.add('show');
        }
      }
      // 신고 아이템 클릭
      else if (e.target.matches('.report-item')) {
        e.stopPropagation();
        const reason = e.target.dataset.reason;
        const card = e.target.closest('.card');
        const userId = card.dataset.userId;
        const userName = card.querySelector('.name').textContent;
        
        currentReportData = { userId: parseInt(userId), reason: reason, userName: userName };
        
        // 모달 열기
        document.getElementById('reportTarget').textContent = `${userName} 님을 신고합니다.`;
        document.getElementById('reportModal').style.display = 'block';
        
        // 드롭다운 닫기
        e.target.closest('.report-dropdown').classList.remove('show');
      }
      // 외부 클릭시 모든 드롭다운 닫기
      else {
        document.querySelectorAll('.report-dropdown').forEach(d => d.classList.remove('show'));
      }
      
      // 모달 외부 클릭시 닫기
      if (e.target.id === 'reportModal') {
        closeReportModal();
      }
    });

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
      document.getElementById('reportDetails').value = '';
      currentReportData = { userId: null, reason: null };
    }

    async function submitReport() {
      if (!currentReportData.userId || !currentReportData.reason) {
        alert('신고 정보가 올바르지 않습니다.');
        return;
      }
      
      const details = document.getElementById('reportDetails').value.trim();
      if (!details) {
        alert('신고 사유를 입력해주세요.');
        return;
      }
      
      const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
      if (!token) {
        alert('로그인이 필요합니다.');
        return;
      }
      
      try {
        const response = await fetch('/api/v1/reports', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            reported_id: currentReportData.userId,
            challenge_id: parseInt('{{ challenge_id or 1 }}'),
            reason: currentReportData.reason,
            comment_text: details,
            details: details
          })
        });
        
        if (response.ok) {
          alert('신고가 접수되었습니다.');
          closeReportModal();
        } else {
          const errorData = await response.json();
          alert('신고 접수에 실패했습니다: ' + (errorData.detail || '알 수 없는 오류'));
        }
      } catch (error) {
        console.error('신고 오류:', error);
        alert('신고 접수 중 오류가 발생했습니다.');
      }
    }

      // ✅ 현재 사용자(본인) 카드 숨기기 + 내가 리뷰한 사용자들은 '등록 완료' 표시
      (async function() {
        const CHALLENGE_ID = parseInt('{{ challenge_id or 1 }}');
        const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
        console.log('Found token:', token ? 'YES' : 'NO'); // 디버그 로그
        
        // 테스트용: URL 파라미터로 토큰 설정 가능 (?token=...)
        const urlParams = new URLSearchParams(window.location.search);
        const testToken = urlParams.get('token');
        if (testToken) {
          localStorage.setItem('access_token', testToken);
          console.log('Test token set from URL parameter');
        }
        
        let finalToken = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
        
        // 개발용: 토큰이 없으면 자동 로그인 시도
        if (!finalToken) {
          try {
            const loginRes = await fetch('/api/v1/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ login: 'testuser', password: 'Test1234!' })
            });
            if (loginRes.ok) {
              const loginData = await loginRes.json();
              finalToken = loginData.access_token;
              localStorage.setItem('access_token', finalToken);
            }
          } catch (err) {
            console.error('Auto-login failed:', err);
          }
        }
        
        // 1) 현재 로그인 사용자 가져와서 본인 카드 숨기기
        if (finalToken) {
          try {
            const meRes = await fetch('/api/v1/auth/me', {
              headers: { 'Authorization': 'Bearer ' + finalToken }
            });
            if (meRes.ok) {
              const me = await meRes.json();
              const myId = me && me.id;
              if (myId) {
                const myCard = document.querySelector(`.card[data-user-id="${myId}"]`);
                if (myCard) myCard.remove();
              }
            }
          } catch (e) {
            console.warn('Failed to fetch current user:', e);
          }
        }

        // 2) 내가 리뷰한 사용자들의 카드만 '등록 완료' 표시
        if (finalToken) {
          // 내가 리뷰한 사용자들의 목록을 서버에서 확인하여 해당 카드만 '등록 완료'로 표시
          fetch(`/api/v1/challenges/${CHALLENGE_ID}/reviews/my-reviewed-users`, {
            headers: { 'Authorization': 'Bearer ' + finalToken }
          }).then(r=>r.json()).then(data => {
            console.log('Review status response:', data); // 디버그 로그
            if (data && data.reviewed_user_ids && data.reviewed_user_ids.length > 0) {
              console.log('Found reviewed users:', data.reviewed_user_ids); // 디버그 로그
              // 내가 리뷰한 사용자들의 카드만 '등록 완료'로 바꿈
              data.reviewed_user_ids.forEach(userId => {
                console.log('Looking for card with user ID:', userId); // 디버그 로그
                const container = document.querySelector(`.review-button-container[data-user-id="${userId}"]`);
                console.log('Found container:', container); // 디버그 로그
                if (container) {
                  const btn = container.querySelector('.review-write-btn');
                  console.log('Found button:', btn); // 디버그 로그
                  if (btn) {
                    const span = document.createElement('span');
                    span.className = 'btn btn-done';
                    span.textContent = '리뷰 등록 완료';
                    btn.replaceWith(span);
                    console.log('Button replaced for user:', userId); // 디버그 로그
                  }
                }
              });
            } else {
              console.log('No reviewed users found or empty response'); // 디버그 로그
            }
          }).catch(err => {
            console.error('Error fetching review status:', err); // 에러 로그
          });
        }
      })();
  </script>
</body>
</html>
