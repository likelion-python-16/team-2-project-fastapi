<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Challenge Home</title>

  <style>
    :root{ --brand:#181C32; --text:#1f2937; --muted:#6b7280; --line:#E5E7EB;
      --primary:#4338CA; --accent:#EEF2FF; --danger:#DC2626; --ok:#059669;
      --chip:#111827; --chip-bg:#F3F4F6;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji"; color:var(--text); background:#fff}
    a{color:var(--primary); text-decoration:none}
    .container{max-width:1120px; margin:0 auto; padding:0 16px}

    .header-bar{border-bottom:1px solid var(--line); background:#fff}
    .header-inner{display:flex; align-items:center; gap:16px; padding:12px 0}
    .brand{display:flex; align-items:center; gap:10px; color:var(--brand); font-weight:700; letter-spacing:.2px}
    .brand .dot{color:#9CA3AF; font-weight:600}
    .spacer{flex:1}
    .search-wrap{display:flex; align-items:center; gap:8px; min-width:420px; flex:0 1 560px}
    .search-input{flex:1; height:38px; border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:14px; outline:none}
    .btn{height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; text-decoration:none}
    .btn.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
    .btn.small{height:30px; padding:0 10px; font-size:13px}
    .avatar{width:36px; height:36px; border-radius:50%; overflow:hidden; border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; background:#f8fafc; font-size:12px; color:#475569}
    .dropdown{position:relative}
    .dropdown-menu{position:absolute; right:0; top:44px; width:200px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.08); display:none; z-index:20}
    .dropdown.open .dropdown-menu{display:block}
    .dropdown-item{display:flex; align-items:center; gap:8px; padding:10px 10px; border-radius:10px; color:var(--text)}
    .dropdown-item:hover{background:#F9FAFB}
    .divider{height:1px; background:var(--line); margin:6px 0}
    .bell{position:relative; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:50%; cursor:pointer}
    .dot-badge{position:absolute; right:4px; top:4px; width:8px; height:8px; background:#ef4444; border-radius:50%; display:none}

    .filters-bar{border-bottom:1px solid var(--line); background:#fff}
    .filters-inner{display:flex; align-items:center; gap:10px; padding:8px 0}
    .toggle-chip{display:flex; align-items:center; gap:8px; padding:6px 10px; height:28px; border:1px dashed var(--line); border-radius:999px; background:#fff; color:var(--muted); font-weight:600; cursor:pointer}
    .toggle-chip i{transition:transform .2s ease}
    .toggle-chip.open i{transform:rotate(180deg)}
    .filters-panel{display:none; padding:10px 0 14px}
    .filters-panel.open{display:block}
    .filters-row{display:grid; grid-auto-flow:column; grid-auto-columns:max-content; gap:10px; align-items:center; overflow-x:auto; padding:0 0 4px}
    .compact-control{height:30px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:13px; background:#fff; color:var(--text)}
    .label{font-size:12px; color:var(--muted); font-weight:600; margin-right:4px}
    .chip{display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; font-size:12px; color:var(--chip); background:var(--chip-bg); border:1px solid var(--line)}

    .section{padding:18px 0}
    .section h3{font-size:18px; margin:0 0 12px; color:#0f172a; letter-spacing:.2px}
    .notice{background:#FFF7ED; color:#9A3412; border:1px solid #FED7AA; padding:10px 12px; border-radius:12px; font-size:13px; margin-bottom:12px}
    .grid{display:grid; gap:14px}
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    .grid.cols-3{grid-template-columns:repeat(3,1fr)}
    .grid.cols-4{grid-template-columns:repeat(4,1fr)}
    .card{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; transition:transform .12s ease, box-shadow .12s ease; position:relative}
    .card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .card.mine{border-color:#8b5cf6; box-shadow:0 6px 20px rgba(139,92,246,.18)}
    .sticky-badge{position:absolute; top:8px; left:-8px; background:#8b5cf6; color:#fff; padding:4px 10px; font-size:11px; font-weight:700; border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,.12); transform:rotate(-3deg)}
    .thumb{aspect-ratio:16/9; background:#F3F4F6; display:block; width:100%; object-fit:cover}
    .card-body{padding:10px 12px}
    .title{font-weight:700; font-size:15px; color:#111827; margin:2px 0 8px}
    .meta{display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:12px; align-items:center}
    .meta-badges{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0}
    .info-pill{display:flex; align-items:center; gap:8px; background:#F3F4F6; color:#374151; border:1px solid var(--line); padding:6px 10px; border-radius:9999px; font-size:12px; margin-top:6px}
    .badge{font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:#fff; color:#374151}
    .badge.ok{background:#ECFDF5; color:#065F46; border-color:#D1FAE5}
    .badge.warn{background:#FEF3C7; color:#92400E; border-color:#FDE68A}
    .badge.free{background:#E0F2FE; color:#0369A1; border-color:#BAE6FD}
    .badge.paid{background:#EDE9FE; color:#5B21B6; border-color:#DDD6FE}
    .empty{padding:24px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px; background:#fff}

    .pagination{display:flex; justify-content:center; gap:6px; margin-top:14px}
    .page-btn{min-width:34px; height:34px; padding:0 10px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-weight:600}
    .page-btn.active{background:var(--primary); border-color:var(--primary); color:#fff}
    .block-gap{height:18px}

    @media (max-width:1024px){
      .search-wrap{min-width:300px}
      .grid.cols-4{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:768px){
      .grid.cols-3{grid-template-columns:repeat(2,1fr)}
      .grid.cols-4{grid-template-columns:repeat(2,1fr)}
      .search-wrap{flex:1; min-width:200px}
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header-bar">
    <div class="container">
      <div class="header-inner">
        <div class="brand" id="home-logo" style="cursor:pointer">
          <span>Metronic</span><span class="dot">·</span><span>Challenge</span>
        </div>
        <div class="spacer"></div>

        <form id="search-form" class="search-wrap" autocomplete="off">
          <input id="search-input" class="search-input" type="text" placeholder="챌린지 제목, 내용, 장소로 검색"/>
          <button id="search-reset" type="button" class="btn" title="초기화">초기화</button>
          <button id="search-btn" type="submit" class="btn primary">검색</button>
        </form>

        <div class="spacer"></div>

        <a href="/chat" class="bell" title="채팅" style="margin-left:10px">
          🔔<span id="chat-dot" class="dot-badge"></span>
        </a>

        <!-- 프로필 드롭다운 -->
        <div class="dropdown" id="profile-dd">
          <div class="avatar" id="profile-trigger">ME</div>
          <div class="dropdown-menu" id="profile-menu"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filters-bar">
    <div class="container">
      <div class="filters-inner">
        <button id="filters-toggle" class="toggle-chip" type="button" aria-expanded="false" aria-controls="filters-panel">
          <span>필터</span><i>▾</i>
        </button>
        <button id="refresh-btn" class="btn" type="button" title="챌린지 목록 새로고침">
          🔄
        </button>
        <div class="spacer"></div>
      </div>
      <div id="filters-panel" class="filters-panel">
        <div class="filters-row">
          <span class="label">상태</span>
          <select id="f-status" class="compact-control">
            <option value="recruiting">모집중</option>
            <option value="active">진행중</option>
            <option value="completed">완료</option>
            <option value="cancelled">취소</option>
          </select>
          <span class="label">장소</span>
          <input id="f-location" class="compact-control" type="text" placeholder="지역, 장소명"/>
          <span class="label">시작</span>
          <input id="f-sf" class="compact-control" type="date"/>
          <span class="label">~</span>
          <input id="f-st" class="compact-control" type="date"/>
          <span class="label">종료</span>
          <input id="f-ef" class="compact-control" type="date"/>
          <span class="label">~</span>
          <input id="f-et" class="compact-control" type="date"/>
          <span class="label">정렬</span>
          <select id="f-sortby" class="compact-control">
            <option value="created_at">최신등록</option>
            <option value="start_date">시작일</option>
            <option value="end_date">종료일</option>
            <option value="title">제목</option>
          </select>
          <select id="f-sortdir" class="compact-control">
            <option value="desc">내림차순</option>
            <option value="asc">오름차순</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <main class="container">
    <!-- 검색 결과 -->
    <section id="search-area" class="section" style="display:none">
      <div class="section">
        <h3>🔍 검색 결과</h3>
        <div id="search-empty" class="empty" style="display:none"></div>
        <div id="search-grid" class="grid cols-4"></div>
      </div>

      <div class="block-gap"></div>

      <div class="section">
        <h3>🎯 이런 챌린지는 어떠세요? <span style="font-size:12px;color:#6b7280;font-weight:400;">(태그 기반 추천)</span></h3>
        <div id="rec-empty" class="empty" style="display:none">관련 태그가 설정된 챌린지가 없습니다.</div>
        <div id="rec-grid" class="grid cols-4"></div>
      </div>

      <div id="search-pagination" class="pagination"></div>
    </section>

    <!-- 홈 섹션 -->
    <section id="home-sections" class="section">
      <div class="section">
        <h3>🎯 추천 챌린지 <span style="font-size:12px;color:#6b7280;font-weight:400;">(선호 태그 기반)</span></h3>
        <div id="rec-login-required" class="notice" style="display:none">추천 기능은 로그인이 필요합니다.</div>
        <div id="rec-notice" class="notice" style="display:none"></div>
        <div id="rec-list" class="grid cols-4"></div>
      </div>

      <div class="block-gap"></div>

      <div class="section">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <h3 style="margin:0;">👥 팔로우한 사람이 만든 챌린지</h3>
          <a href="/users-list" class="btn small">사용자 찾기</a>
        </div>
        <div id="follow-login-required" class="notice" style="display:none">
          팔로우 기능은 로그인이 필요합니다. <a href="/users-list" style="color:#4338CA;">다른 사용자 보기</a>
        </div>
        <div id="follow-list" class="grid cols-4"></div>
      </div>

      <div class="block-gap"></div>

      <div class="section">
        <h3>📅 최신 챌린지</h3>
        <div id="latest-list" class="grid cols-4"></div>
        <div id="latest-pagination" class="pagination"></div>
      </div>
    </section>
  </main>

  <script>
    // (선택) 비로그인 시 생성 버튼 누르면 로그인 유도
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('create-challenge-btn');
      if (!btn) return;
      btn.addEventListener('click', (e) => {
        const t = localStorage.getItem('access_token');
        if (!t) {
          e.preventDefault();
          alert('로그인이 필요합니다 🙏');
          location.href = '/login';
        }
      });
    });
  </script>
  <script>
    // Unread chat indicator
    function getChatToken(){ try{ return localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||null; }catch{ return null; } }
    async function updateChatDot(){
      const t = getChatToken(); if(!t) return;
      try{
        const r = await fetch('/api/v1/chat/unread-count', { headers:{ 'Authorization': 'Bearer '+t }, credentials:'include' });
        if(!r.ok) return; const j = await r.json();
        const n = (j?.unread)||0; const dot = document.getElementById('chat-dot');
        if(dot) dot.style.display = n>0? 'block':'none';
      }catch{}
    }
    document.addEventListener('DOMContentLoaded', ()=>{ updateChatDot(); setInterval(updateChatDot, 30000); });
    // 로그인 직후 토큰이 저장되는 경우를 대비
    window.addEventListener('storage', (e)=>{ if(e.key==='access_token'){ setTimeout(updateChatDot, 300); } });
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) updateChatDot(); });
  </script>

  <script src="{{ url_for('static', path='js/home.js') }}"></script>
</body>
</html>
