<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>결제 실패</title></head>
<body>
<script>
const sp = new URLSearchParams(location.search);
const msg = sp.get('message') || '결제가 실패했습니다.';
alert('결제 실패: ' + msg);
const challengeId = Number(sp.get('challenge_id') || sessionStorage.getItem('pay_challenge_id') || 0);
location.replace(challengeId ? `/pages/challenges/${challengeId}` : '/home');
</script>
</body>
</html>
