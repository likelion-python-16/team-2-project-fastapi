{% extends "final.html" %}
{% block title %}관리자 가입 - 프로필 설정{% endblock %}
{% block content %}
<style> body { flex-direction: column; } .avatar-wrap{width:72px;height:72px;border-radius:9999px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa} .avatar-wrap img{display:none;width:100%;height:100%;object-fit:cover} .avatar-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#9ca3af} </style>
<div class="flex items-start justify-center min-h-[100dvh] w-full overflow-y-auto py-8">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="adminProfileForm" method="post" novalidate>
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium mb-2.5">🎨 관리자 가입 - 프로필 설정</h3>
        <div class="flex justify-center items-center gap-2 flex-nowrap text-sm text-muted-foreground mb-4">
          <span class="inline-flex items-center gap-2 text-muted-foreground/50"><span class="w-7 h-7 bg-green-500 text-white rounded-full flex items-center justify-center text-sm font-bold leading-none">✓</span>기본 정보</span>
          <span>→</span>
          <span class="inline-flex items-center gap-2 text-muted-foreground/50"><span class="w-7 h-7 bg-green-500 text-white rounded-full flex items-center justify-center text-sm font-bold leading-none">✓</span>추가 정보</span>
          <span>→</span>
          <span class="inline-flex items-center gap-2"><span class="w-7 h-7 bg-primary text-primary-foreground rounded-full flex items-center justify-center text-sm font-bold leading-none">3</span>프로필</span>
        </div>
        <div class="text-sm text-muted-foreground">마지막 단계! 프로필 이미지를 설정하고 소개를 적어주세요</div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">프로필 이미지</label>
        <div class="flex items-center gap-3">
          <div class="avatar-wrap"><img id="profilePreview" alt="미리보기"><i id="defaultAvatar" class="ki-filled ki-user avatar-fallback"></i></div>
          <div class="flex-1 space-y-2">
            <input class="kt-input" id="profile_image" name="profile_image" placeholder="/static/pictures/xxx.jpg 또는 https://..." type="url">
            <div class="flex items-center gap-2">
              <input id="profile_file" type="file" accept="image/*" class="hidden">
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnPick">파일 선택</button>
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnUpload">업로드</button>
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnDefault">기본 아바타</button>
            </div>
            <div id="uploadMsg" class="text-xs" style="display:none;color:#059669">업로드 완료!</div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">자기소개</label>
        <textarea class="kt-input" id="introduction" name="introduction" placeholder="안녕하세요!" rows="4" maxlength="500"></textarea>
        <div class="flex justify-between items-center"><span class="text-xs text-muted-foreground">다른 사용자에게 보여집니다</span><span class="text-xs text-muted-foreground" id="charCount">0/500</span></div>
      </div>

      <!-- 관심사(카테고리) 선택 -->
      <div class="flex flex-col gap-2">
        <label class="kt-form-label">관심사(카테고리) 선택</label>
        <div class="text-[11px] text-muted-foreground">최대 10개까지 선택할 수 있어요.</div>
        <div id="selectedTags" class="flex flex-wrap gap-2"></div>
        <div id="tagList" class="flex flex-wrap gap-2 max-h-56 overflow-auto border border-border rounded-md p-2">
          <span id="tagLoading" class="text-xs text-muted-foreground">로딩 중...</span>
        </div>
      </div>

      <div class="flex gap-3">
        <button class="kt-btn kt-btn-light flex justify-center grow" type="button" id="btnPrev">이전 단계</button>
        <button class="kt-btn kt-btn-primary flex justify-center grow" id="submitBtn" type="submit">완료</button>
      </div>
    </form>
  </div>
</div>

<script>
const DEFAULT_AVATAR = '/static/pictures/defaultprofile.svg';
function updateProfilePreview(url){
  const img=document.getElementById('profilePreview');
  const icon=document.getElementById('defaultAvatar');
  if(!url){ img.removeAttribute('src'); icon.style.display='flex'; img.style.display='none'; return; }
  img.onload=()=>{ icon.style.display='none'; img.style.display='block'; };
  img.onerror=()=>{ icon.style.display='flex'; img.style.display='none'; };
  img.src=url;
  if(img.complete && img.naturalWidth>0){ icon.style.display='none'; img.style.display='block'; }
}
async function uploadFileToServer(file, btn){
  if(!file){ alert('먼저 파일을 선택해 주세요.'); return null; }
  const fd=new FormData(); fd.append('file', file);
  const orig=btn.textContent; btn.disabled=true; btn.textContent='업로드 중...';
  try{ const res=await fetch('/api/v1/files/profile-image',{method:'POST',body:fd}); const j=await res.json(); if(!res.ok||!j?.url) throw new Error(j?.detail||'업로드 실패'); alert('업로드 완료!'); const m=document.getElementById('uploadMsg'); if(m){ m.textContent='업로드 완료!'; m.style.display='block'; } return j.url; }
  catch(e){ alert(e.message||e); return null; }
  finally{ btn.disabled=false; btn.textContent=orig; }
}
document.addEventListener('DOMContentLoaded',()=>{
  const btnPick=document.getElementById('btnPick');
  const btnDefault=document.getElementById('btnDefault');
  const btnUpload=document.getElementById('btnUpload');
  const fileInput=document.getElementById('profile_file');
  const urlInput=document.getElementById('profile_image');
  const intro=document.getElementById('introduction');
  const cnt=document.getElementById('charCount');

  async function autoSaveAvatar(url){
    try{
      if(!url) return;
      const token = localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||'';
      await fetch('/api/v1/users/me/profile',{
        method:'PATCH',
        headers:{'Content-Type':'application/json', ...(token? { Authorization: 'Bearer '+token } : {})},
        credentials:'include',
        body: JSON.stringify({ avatar_url: url })
      });
    }catch(_){ /* ignore auto-save errors */ }
  }

  if(!urlInput.value?.trim()){ urlInput.value=DEFAULT_AVATAR; }
  updateProfilePreview(urlInput.value.trim());
  intro.addEventListener('input',()=>{ cnt.textContent = (intro.value.length||0) + '/500'; });
  btnPick.addEventListener('click',()=>fileInput.click());
  btnDefault.addEventListener('click',async ()=>{ urlInput.value=DEFAULT_AVATAR; updateProfilePreview(DEFAULT_AVATAR); await autoSaveAvatar(DEFAULT_AVATAR); const m=document.getElementById('uploadMsg'); if(m){ m.textContent='기본 아바타 저장됨'; m.style.display='block'; } alert('기본 아바타가 저장되었습니다.'); });
  fileInput.addEventListener('change', async ()=>{ const f=fileInput.files?.[0]; if(!f) return; updateProfilePreview(URL.createObjectURL(f)); const u=await uploadFileToServer(f, btnUpload); if(u){ urlInput.value=u; updateProfilePreview(u); await autoSaveAvatar(u); } });
  btnUpload.addEventListener('click', async ()=>{ const f=fileInput.files?.[0]; const u=await uploadFileToServer(f, btnUpload); if(u){ urlInput.value=u; updateProfilePreview(u); await autoSaveAvatar(u); } });
  urlInput.addEventListener('change', async ()=>{ const v=(urlInput.value||'').trim(); if(v){ updateProfilePreview(v); await autoSaveAvatar(v); } });
  document.getElementById('adminProfileForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const bioText = (document.getElementById('introduction').value||'').trim();
    const interests = { categories: [], keywords: [...selected] };
    const introJson = JSON.stringify({ bio: bioText, interests });
    const payload = {
      avatar_url: (document.getElementById('profile_image').value||'').trim(),
      introduction: introJson
    };
    try{
      const token = localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||'';
      await fetch('/api/v1/users/me/profile', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...(token? { Authorization: 'Bearer '+token } : {}) },
        credentials: 'include',
        body: JSON.stringify(payload)
      });
    }catch(_){ }
    alert('설정이 저장되었습니다.');
    window.location.href='/admin';
  });
  document.getElementById('btnPrev').addEventListener('click',()=>{ window.location.href='/admin/signup2'; });
});

// ===== 카테고리 로드/선택 (간단 버전) =====
const MAX_TAGS = 10;
let selected = new Set();

async function loadCategories(){
  const list=document.getElementById('tagList');
  const loading=document.getElementById('tagLoading');
  try{
    const res=await fetch('/api/v1/tags/categories');
    const cats=await res.json();
    list.innerHTML='';
    const arr=Array.isArray(cats)?cats:[];
    if(arr.length===0){ list.innerHTML='<span class="text-xs text-muted-foreground">카테고리가 없습니다.</span>'; return; }
    arr.forEach(label=>{
      const btn=document.createElement('button');
      btn.type='button'; btn.dataset.tag=label;
      btn.className='px-2 py-1 rounded-full border text-xs bg-muted text-muted-foreground';
      btn.textContent=label;
      btn.addEventListener('click',()=>{
        if(selected.has(label)) selected.delete(label);
        else{
          if(selected.size>=MAX_TAGS){ alert('태그는 최대 10개까지 선택할 수 있어요.'); return; }
          selected.add(label);
        }
        paintCategories(); renderSelected();
      });
      list.appendChild(btn);
    });
    paintCategories(); renderSelected();
  }catch(e){ if(loading) loading.textContent='불러오기 실패'; }
}
function paintCategories(){
  document.querySelectorAll('#tagList button[data-tag]').forEach(b=>{
    const picked=selected.has(b.dataset.tag);
    b.className=`px-2 py-1 rounded-full border text-xs ${picked?'bg-primary text-primary-foreground':'bg-muted text-muted-foreground'}`;
  });
}
function renderSelected(){
  const hold=document.getElementById('selectedTags'); hold.innerHTML='';
  [...selected].forEach(label=>{
    const pill=document.createElement('span');
    pill.className='px-2 py-1 rounded-full border text-xs bg-primary/10 text-primary';
    pill.innerHTML=`${label} <button type="button" class="ms-1 text-primary/70" aria-label="remove">x</button>`;
    pill.querySelector('button').onclick=()=>{ selected.delete(label); paintCategories(); renderSelected(); };
    hold.appendChild(pill);
  });
}

document.addEventListener('DOMContentLoaded', loadCategories);
</script>
{% endblock %}
