{% extends "final.html" %}
{% block title %}계정 연동 확인 - Team Project{% endblock %}
{% block content %}
<div class="flex items-center justify-center grow">
  <div class="kt-card max-w-[520px] w-full">
    <div class="kt-card-content flex flex-col gap-6 p-10">
      <div class="text-center mb-4">
        <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="ki-filled ki-information text-yellow-600 text-2xl"></i>
        </div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">기존 계정이 발견되었습니다</h3>
        <p class="text-gray-600 text-sm">동일한 정보로 가입된 계정이 있습니다. 계정을 연동하시겠습니까?</p>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <!-- 기존 계정 정보 -->
      <div id="existingAccountInfo" class="bg-gray-50 rounded-lg p-4">
        <h4 class="font-medium text-gray-900 mb-3">기존 계정 정보</h4>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-600">사용자명:</span>
            <span id="existingUsername" class="font-medium"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-600">이름:</span>
            <span id="existingName" class="font-medium"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-600">이메일:</span>
            <span id="existingEmail" class="font-medium"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-600">매칭 기준:</span>
            <span id="matchType" class="text-blue-600 font-medium"></span>
          </div>
        </div>
      </div>

      <!-- 소셜 계정 정보 -->
      <div id="socialAccountInfo" class="bg-blue-50 rounded-lg p-4">
        <h4 class="font-medium text-gray-900 mb-3">소셜 계정 정보</h4>
        <div class="flex items-center gap-3">
          <div id="socialProviderIcon" class="w-10 h-10 rounded-full bg-white flex items-center justify-center"></div>
          <div class="flex-1">
            <div id="socialName" class="font-medium text-gray-900"></div>
            <div id="socialEmail" class="text-sm text-gray-600"></div>
          </div>
        </div>
      </div>

      <!-- 비밀번호 입력 (계정 연동 시) -->
      <div id="passwordSection" class="hidden">
        <div class="flex flex-col gap-2">
          <label class="kt-form-label">기존 계정의 비밀번호를 입력해주세요</label>
          <input type="password" id="password" class="kt-input" placeholder="비밀번호 입력" required>
          <p class="text-xs text-gray-500">계정 보안을 위해 기존 계정의 비밀번호를 확인합니다.</p>
        </div>
      </div>

      <!-- 선택 버튼 -->
      <div class="flex flex-col gap-3">
        <button type="button" id="btnMerge" class="kt-btn kt-btn-primary">
          <span id="btnMergeText">계정 연동하기</span>
          <span id="btnMergeLoading" class="hidden">연동 중...</span>
        </button>
        
        <button type="button" id="btnDecline" class="kt-btn kt-btn-outline">
          새 계정으로 진행하기
        </button>
      </div>

      <div class="text-center">
        <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">로그인으로 돌아가기</a>
      </div>
    </div>
  </div>
</div>

<script>
let mergeStep = 'select'; // 'select' or 'password'

function showAlert(message, type = "error") {
  const el = document.getElementById("alertContainer");
  const css = type === "error" ? "kt-alert-danger" : "kt-alert-success";
  el.innerHTML = `
    <div class="${css} p-3 rounded-lg flex items-center gap-2">
      <i class="ki-filled ${type === "error" ? 'ki-information-2' : 'ki-check'}"></i>
      <span class="text-sm">${message}</span>
    </div>`;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 5000);
}

async function loadMergeInfo() {
  try {
    const response = await fetch('/api/v1/auth/social/merge-info');
    if (!response.ok) {
      throw new Error('연동 정보를 불러올 수 없습니다');
    }
    
    const data = await response.json();
    
    // 기존 계정 정보 표시
    document.getElementById('existingUsername').textContent = data.existing_account.username;
    document.getElementById('existingName').textContent = data.existing_account.name;
    document.getElementById('existingEmail').textContent = data.existing_account.email;
    
    const matchTypeText = {
      'email': '이메일',
      'phone': '전화번호', 
      'identification': '주민번호'
    };
    document.getElementById('matchType').textContent = matchTypeText[data.existing_account.match_type] || '정보';
    
    // 소셜 계정 정보 표시
    const provider = data.social_data.provider;
    const providerIcon = document.getElementById('socialProviderIcon');
    
    if (provider === 'google') {
      providerIcon.innerHTML = `
        <svg viewBox="0 0 24 24" class="w-6 h-6">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>`;
    } else if (provider === 'naver') {
      providerIcon.innerHTML = `
        <svg viewBox="0 0 24 24" class="w-6 h-6">
          <path fill="#03C75A" d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/>
        </svg>`;
    }
    
    document.getElementById('socialName').textContent = data.social_data.name;
    document.getElementById('socialEmail').textContent = data.social_data.email;
    
  } catch (error) {
    showAlert(error.message);
    setTimeout(() => window.location.href = '/login', 2000);
  }
}

// 계정 연동 버튼
document.getElementById('btnMerge').addEventListener('click', async () => {
  if (mergeStep === 'select') {
    // 비밀번호 입력 단계로 전환
    mergeStep = 'password';
    document.getElementById('passwordSection').classList.remove('hidden');
    document.getElementById('btnMergeText').textContent = '연동 확인';
    document.getElementById('password').focus();
  } else {
    // 실제 연동 수행
    const password = document.getElementById('password').value.trim();
    if (!password) {
      showAlert('비밀번호를 입력해주세요');
      return;
    }
    
    const btnMerge = document.getElementById('btnMerge');
    const btnMergeText = document.getElementById('btnMergeText');
    const btnMergeLoading = document.getElementById('btnMergeLoading');
    
    btnMerge.disabled = true;
    btnMergeText.classList.add('hidden');
    btnMergeLoading.classList.remove('hidden');
    
    try {
      const response = await fetch('/api/v1/auth/social/merge-confirm', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ password })
      });
      
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.detail || '연동에 실패했습니다');
      }
      
      const data = await response.json();
      
      // 토큰 저장
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      
      showAlert('계정 연동이 완료되었습니다!', 'success');
      setTimeout(() => window.location.href = '/home', 1500);
      
    } catch (error) {
      showAlert(error.message);
    } finally {
      btnMerge.disabled = false;
      btnMergeText.classList.remove('hidden');
      btnMergeLoading.classList.add('hidden');
    }
  }
});

// 새 계정 진행 버튼
document.getElementById('btnDecline').addEventListener('click', async () => {
  try {
    await fetch('/api/v1/auth/social/merge-decline', {
      method: 'POST'
    });
    
    showAlert('새 계정으로 진행합니다', 'success');
    setTimeout(() => window.location.href = '/social/step1', 1000);
    
  } catch (error) {
    console.error('Decline failed:', error);
    window.location.href = '/social/step1';
  }
});

// 페이지 로드 시 연동 정보 로드
document.addEventListener('DOMContentLoaded', loadMergeInfo);
</script>
{% endblock %}
