{% extends "final.html" %}
{% block title %}소셜 회원가입 1단계 - Team Project{% endblock %}
{% block content %}
<div class="flex items-start justify-center grow py-8">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="socialStep1" method="post" novalidate>
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">소셜 회원가입 · 1단계</h3>
        <div class="text-sm text-muted-foreground">아래 필수 정보를 입력해 주세요</div>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <div id="socialInfoBox" class="rounded-lg p-3 border border-muted bg-muted/20 text-xs text-muted-foreground">
        <div class="flex items-center gap-3">
          <img id="prefAvatar" class="w-9 h-9 rounded-full border border-border object-cover" alt="avatar"/>
          <div class="flex-1">
            <div>소셜에서 확인된 정보</div>
            <div id="socialProvider" class="mt-0.5"></div>
            <div id="socialName" class="mt-0.5"></div>
            <div id="socialEmail" class="mt-0.5"></div>
            <div id="socialSuggest" class="mt-0.5"></div>
          </div>
        </div>
      </div>

      <!-- 이름 (수정 가능) -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">이름 *</label>
        <input class="kt-input" id="name" placeholder="본인 실명" required />
      </div>

      <!-- 사용자명(아이디) -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">아이디(사용자명) *</label>
        <input class="kt-input" id="username" placeholder="영문으로 시작하는 3–50자 (영문/숫자/_ )" required />
        <div id="dup-username" class="text-xs mt-1 text-muted-foreground"></div>
      </div>

      <!-- 전화번호 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">전화번호 *</label>
        <input class="kt-input" id="phone" name="phone" placeholder="010-1234-5678" type="tel" required />
        <span class="text-[11px] text-muted-foreground">010으로 시작하는 11자리</span>
        <div id="dup-phone" class="text-xs mt-1 hidden"></div>
      </div>

      <!-- 주민등록번호 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">주민등록번호 *</label>
        <input class="kt-input" id="identification_number" placeholder="123456-1234567" required />
        <span class="text-[11px] text-muted-foreground">실명 확인용</span>
      </div>

      <div class="flex items-center gap-3">
        <button type="button" class="kt-btn kt-btn-outline flex-1" id="btnBack">이전</button>
        <button type="submit" class="kt-btn kt-btn-primary flex-1" id="btnNext">다음 단계</button>
      </div>
    </form>
  </div>
</div>

<script>
// 소셜 정보 로드
async function loadSocialInfo() {
  try {
    const response = await fetch('/api/v1/auth/identity/last');
    if (!response.ok) throw new Error('소셜 정보를 찾을 수 없습니다');
    
    const data = await response.json();
    
    // UI 업데이트
    document.getElementById('socialProvider').textContent = `${data.provider || ''} 로그인`;
    document.getElementById('socialName').textContent = `이름: ${data.name || ''}`;
    document.getElementById('socialEmail').textContent = `이메일: ${data.email || ''}`;
    
    // 기본값 설정
    if (data.name) document.getElementById('name').value = data.name;
    if (data.email) {
      const username = data.email.split('@')[0];
      document.getElementById('username').value = username;
    }
    
    if (data.picture) {
      document.getElementById('prefAvatar').src = data.picture;
    }
    
  } catch (error) {
    console.error('소셜 정보 로드 실패:', error);
    window.location.href = '/login';
  }
}

// 폼 제출
document.getElementById('socialStep1').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = {
    name: document.getElementById('name').value.trim(),
    username: document.getElementById('username').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    identification_number: document.getElementById('identification_number').value.trim()
  };
  
  // 유효성 검사
  if (!formData.name || !formData.username || !formData.phone || !formData.identification_number) {
    alert('모든 필드를 입력해주세요');
    return;
  }
  
  // 세션 스토리지에 저장
  sessionStorage.setItem('socialStep1Data', JSON.stringify(formData));
  
  // 2단계로 이동
  window.location.href = '/social/step2';
});

document.getElementById('btnBack').addEventListener('click', () => {
  window.location.href = '/login';
});

// 페이지 로드시 소셜 정보 로드
document.addEventListener('DOMContentLoaded', loadSocialInfo);
</script>
{% endblock %}
