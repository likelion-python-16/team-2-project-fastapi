<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>장소 검색 · 팝업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,apple-system,Segoe UI,Roboto,Noto Sans KR,Arial,sans-serif;margin:16px}
    .row{display:flex;gap:8px}
    .panel{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-top:10px}
    .item{padding:8px;border-bottom:1px solid #eee;cursor:pointer}
    .item:hover{background:#f7f7f7}
    .muted{color:#666;font-size:12px}
  </style>
</head>
<body>
  <h3>장소 검색</h3>
  <div class="row">
    <input id="q" placeholder="예: 정자동 카페" style="flex:1">
    <button id="btn">검색</button>
  </div>
  <div class="muted" style="margin-top:6px">네이버 로컬 검색을 사용합니다.</div>

  <div id="list" class="panel" style="display:none"></div>
  <div id="err" class="muted" style="margin-top:6px"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const scope = params.get('scope') || 'row';
    const rid = params.get('rid') ? parseInt(params.get('rid'), 10) : null;

    const list = document.getElementById('list');
    const err = document.getElementById('err');

    document.getElementById('btn').addEventListener('click', doSearch);
    document.getElementById('q').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });

    function placeIdFrom(item){
      const link = item.link || item.place_url || item.url || '';
      const m = (link||'').match(/(?:entry\/place|\/place)\/(\d+)/);
      if (m && m[1]) return m[1];
      const m2 = (link||'').match(/[?&]placeId=(\d+)/i);
      if (m2 && m2[1]) return m2[1];
      return null;
    }
    function naverPlaceUrl({ placeId, lat, lng, title } = {}){
      const lvl=15;
      if (placeId){
        const c = (lat!=null && lng!=null) ? `?c=${lng},${lat},${lvl},0,0,0,dh` : '';
        return `https://map.naver.com/v5/entry/place/${encodeURIComponent(String(placeId))}${c}`;
      }
      if (lat!=null && lng!=null){
        return `https://map.naver.com/v5/?c=${lng},${lat},${lvl},0,0,0,dh`;
      }
      const key = encodeURIComponent((title||'').trim());
      return `https://map.naver.com/v5/search/${key}`;
    }

    async function doSearch(){
      const q = (document.getElementById('q').value || '').trim();
      if (!q){ list.style.display='none'; list.innerHTML=''; return; }
      try{
        err.textContent='';
        const data = (await axios.get('/naver/local', { params: { q, display: 10, start: 1 }})).data;
        const items = data.items || [];
        if (!items.length){ list.style.display='none'; list.innerHTML=''; return; }
        list.style.display='block';
        list.innerHTML = items.map((it, i)=>{
          const title = (it.name||it.title||'').replace(/<[^>]+>/g,'');
          const road = it.roadAddress || it.road_address || '';
          const addr = it.address || it.jibunAddress || '';
          return `<div class="item" data-i="${i}">
            <div style="font-weight:600">${title}</div>
            <div class="muted">${road || addr}</div>
          </div>`;
        }).join('');

        list.querySelectorAll('.item').forEach((el)=>{
          el.addEventListener('click', async (e)=>{
            const i = parseInt(el.getAttribute('data-i'), 10);
            const it = items[i];
            const title = (it.name||it.title||'').replace(/<[^>]+>/g,'');
            const road = it.roadAddress || it.road_address || '';
            const addr = it.address || it.jibunAddress || '';
            let lat=null, lng=null;
            try{
              const key = road || addr || title;
              if (key){
                const geo = (await axios.get('/places/geocode', { params: { query: key }})).data;
                lat = geo.lat ?? null; lng = geo.lng ?? null;
              }
            }catch(e){}
            const placeId = placeIdFrom(it);
            const link = naverPlaceUrl({ placeId, lat, lng, title });

            // 부모창으로 전달
            if (window.opener){
              window.opener.postMessage({
                type: 'place-picked',
                scope, rid,
                place: {
                  place_name: title,
                  road_address: road || null,
                  address: addr || null,
                  map_url: link,
                  lat, lon: lng
                }
              }, window.location.origin);
            }
            window.close();
          });
        });

      }catch(e){
        list.style.display='none'; list.innerHTML='';
        err.textContent = '오류: ' + (e?.response?.data?.detail || e.message || 'Unknown');
      }
    }
  </script>
</body>
</html>
