<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채팅방</title>
  <style>
    body{margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:#fff}
    .wrap{max-width:840px; margin:0 auto; height:100vh; display:flex; flex-direction:column}
    .header{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee}
    .header a{ text-decoration:none; color:inherit }
    .title-link{ color:#4338CA; text-decoration:none; font-weight:800 }
    .chat{flex:1; display:flex; flex-direction:column; padding:12px}
    .log{flex:1; overflow:auto; border:1px solid #eee; border-radius:10px; padding:12px; background:#fafbfc}
    .msg{margin:6px 0; display:flex}
    .msg.me{justify-content:flex-end}
    .msg.other{justify-content:flex-start}
    .bubble{max-width:68%; padding:8px 10px; border-radius:12px; line-height:1.3; word-break:break-word}
    .me .bubble{background:#4338CA; color:#fff; border-bottom-right-radius:4px}
    .other .bubble{background:#fff; color:#111827; border:1px solid #e5e7eb; border-bottom-left-radius:4px}
    .ts{color:#6b7280; font-size:11px; margin:0 6px}
    .send{display:flex; gap:8px; margin-top:10px}
    input[type=text]{flex:1; height:40px; padding:0 12px; border:1px solid #e5e7eb; border-radius:10px}
    button{height:40px; padding:0 14px; border-radius:10px; border:1px solid #e5e7eb; background:#4338CA; color:#fff; font-weight:600}
  </style>
  <script>
    function token(){ try{ return localStorage.getItem('access_token') || sessionStorage.getItem('access_token') || null; }catch{ return null; } }
    async function jget(url){ const h={}; const t=token(); if(t) h['Authorization']='Bearer '+t; const r=await fetch(url,{headers:h, credentials:'include'}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j?.detail||j?.message||('HTTP '+r.status)); return j; }
    async function jpost(url, body){ const h={'Content-Type':'application/json'}; const t=token(); if(t) h['Authorization']='Bearer '+t; const r=await fetch(url,{method:'POST', headers:h, body:body?JSON.stringify(body):undefined, credentials:'include'}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j?.detail||j?.message||('HTTP '+r.status)); return j; }
    document.addEventListener('DOMContentLoaded', async ()=>{
      const rid = Number(location.pathname.split('/').pop());
      const log = document.getElementById('log');
      const input = document.getElementById('input');
      const btn = document.getElementById('send');

      async function load(){
        const res = await jget(`/api/v1/chat/rooms/${rid}/messages?limit=50`);
        log.innerHTML = (res.items||[]).map(m=>{
          const me = m.sender_id === window.__ME_ID__;
          const t = new Date(m.created_at).toLocaleTimeString('ko-KR');
          return `<div class="msg ${me?'me':'other'}"><div class="bubble">${m.content}</div><span class="ts">${t}</span></div>`;
        }).join('');
        log.scrollTop = log.scrollHeight;
      }

      // 현재 사용자
      try{
        const me = await jget('/api/v1/auth/me');
        window.__ME_ID__ = me.id;
      }catch{}

      // 방 메타(상대 username 사용, 클릭 시 마이페이지 이동)
      try{
        const meta = await jget(`/api/v1/chat/rooms/${rid}/meta`);
        const h = document.getElementById('room_title');
        if(h && meta?.other){
          const uname = meta.other.username || '상대';
          const uid = meta.other.id;
          h.innerHTML = `<a class="title-link" href="/users/${uid}">@${uname}</a>님과의 채팅`;
        } else if (h && meta?.title) {
          h.textContent = meta.title;
        }
      }catch{}

      await load();

      const t = token();
      const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/v1/chat/ws/${rid}?token=${encodeURIComponent(t||'')}`);
      ws.onmessage = (ev)=>{
        try{
          const msg = JSON.parse(ev.data);
          if(msg.type==='message'){
            const me = msg.sender_id === window.__ME_ID__;
            const t = new Date(msg.created_at).toLocaleTimeString('ko-KR');
            // 내 메시지 중복 방지: client_id로 기존 낙관적 요소가 있으면 갱신만
            if(me && msg.client_id){
              const existed = log.querySelector(`[data-cid="${msg.client_id}"]`);
              if(existed){
                const tsEl = existed.querySelector('.ts');
                if(tsEl) tsEl.textContent = t;
                return;
              }
            }
            const el = document.createElement('div');
            el.className='msg '+(me?'me':'other');
            el.innerHTML = `<div class="bubble">${msg.content}</div><span class="ts">${t}</span>`;
            log.appendChild(el); log.scrollTop = log.scrollHeight;
          }
        }catch{}
      };

      async function send(){
        const text = input.value.trim();
        if(!text) return;
        // optimistic append
        const now = new Date();
        const cid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c'+Date.now()+Math.random().toString(36).slice(2));
        const meEl = document.createElement('div'); meEl.className='msg me';
        meEl.setAttribute('data-cid', cid);
        meEl.innerHTML = `<div class="bubble">${text}</div><span class="ts">${now.toLocaleTimeString('ko-KR')}</span>`;
        log.appendChild(meEl); log.scrollTop = log.scrollHeight;
        if(ws.readyState===1){ ws.send(JSON.stringify({type:'message', content:text, client_id: cid})); }
        input.value='';
      }
      btn.addEventListener('click', send);
      input.addEventListener('keypress', e=>{ if(e.key==='Enter') send(); });

      // 읽음 처리
      try{ await jpost(`/api/v1/chat/rooms/${rid}/read`); }catch{}
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a href="/chat">←</a>
      <h3 id="room_title" style="margin:0">채팅방</h3>
    </div>
    <div class="chat">
      <div id="log" class="log"></div>
      <div class="send">
        <input id="input" type="text" placeholder="메시지를 입력하세요" />
        <button id="send">전송</button>
      </div>
    </div>
  </div>
</body>
</html>
