{% extends "final.html" %}
{% block title %}개인정보 입력 - Team Project{% endblock %}
{% block content %}
<div id="pageBg" class="flex items-start justify-center grow bg-center bg-no-repeat page-bg py-8">
  <!-- step1과 맞춰 살짝 넓게: 440px -->
  <div class="kt-card max-w-[440px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="personalInfoForm" method="post">
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">📋 개인정보 입력</h3>

        <!-- 스텝 표시: 한 줄 유지 + 크기/간격 step1과 동일 -->
        <div class="flex justify-center items-center gap-1 text-sm text-muted-foreground mb-4 whitespace-nowrap">
          <!-- 1단계: 완료(초록 체크) -->
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-green-500 text-white font-bold text-sm leading-none">✓</span>
            <span>기본 정보</span>
          </div>

          <span>→</span>

          <!-- 2단계: 진행중(파랑 원) -->
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-primary text-primary-foreground font-bold text-sm leading-none">2</span>
            <span>개인 정보</span>
          </div>

          <span>→</span>

          <!-- 3단계: 대기(회색) -->
          <div class="flex items-center gap-2 text-muted-foreground/50">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-muted text-muted-foreground font-bold text-sm leading-none">3</span>
            <span>프로필 설정</span>
          </div>
        </div>

        <div class="text-sm text-muted-foreground">
          더 나은 서비스를 위해 개인정보를 입력해주세요 (모두 선택사항)
        </div>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <!-- 성별 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">성별</label>
        <select class="kt-input" id="gender" name="gender">
          <option value="">선택하지 않음</option>
          <option value="male">남성</option>
          <option value="female">여성</option>
          <option value="other">기타</option>
        </select>
      </div>

      <!-- 거주 지역 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">거주 지역 (상세 주소는 적지 말아주세요)</label>
        <input class="kt-input" id="region_living" name="region_living" placeholder="예: 경기도 성남시 분당구 정자동" type="text"/>
      </div>

      <!-- 활동 지역 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label">주요 활동 지역</label>
        <input class="kt-input" id="region_active" name="region_active" placeholder="예: 서울특별시" type="text"/>
      </div>

      <div class="flex gap-3">
        <button class="kt-btn kt-btn-light flex justify-center grow" type="button" id="btnSkip">건너뛰기</button>
        <button class="kt-btn kt-btn-primary flex justify-center grow" id="submitBtn" type="submit">다음 단계</button>
      </div>

      <div class="text-center text-xs text-muted-foreground mt-2">
        💡 나중에 프로필에서 언제든 수정할 수 있습니다
      </div>
    </form>
  </div>
</div>

<script>
  // ---- draft helpers (step1에서 사용한 구조와 동일) ----
  const KEY = 'signupDraft';
  function getDraft() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
    catch { return {}; }
  }
  function mergeDraft(patch) {
    const next = { ...getDraft(), ...patch };
    localStorage.setItem(KEY, JSON.stringify(next));
    return next;
  }

  // 이전 단계 강제 진행 보호
  (function guard() {
    const d = getDraft();
    const ok = ['username','email','password','phone','identification_number'].every(k => d[k]);
    if (!ok) window.location.href = '/signup';
  })();

  // 제출/건너뛰기
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('personalInfoForm').addEventListener('submit', (e) => {
      e.preventDefault();
      mergeDraft({
        gender: document.getElementById('gender').value || null,
        region_living: document.getElementById('region_living').value || '',
        region_active: document.getElementById('region_active').value || ''
      });
      window.location.href = '/signup/step3';
    });

    document.getElementById('btnSkip').addEventListener('click', () => {
      if (confirm('개인정보 입력을 건너뛰시겠습니까? 나중에 프로필에서 입력할 수 있습니다.')) {
        window.location.href = '/signup/step3';
      }
    });
  });
</script>

<!-- 배경 이미지는 JS로 적용(기존 규칙 유지) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  const el = document.getElementById('pageBg');
  if (!el) return;
  el.style.backgroundImage = 'url("{{ url_for("static", path="assets/final/media/images/2600x1200/bg-10.png") }}")';
  el.style.backgroundPosition = 'center';
  el.style.backgroundRepeat = 'no-repeat';
});
</script>
{% endblock %}
