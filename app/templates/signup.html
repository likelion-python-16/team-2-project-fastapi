{% extends "final.html" %}
{% block title %}회원가입 - Team Project{% endblock %}

{% block content %}
<div class="flex items-center justify-center grow bg-center bg-no-repeat page-bg" 
     style="background-image:url('{{ url_for('static', path='assets/final/media/images/2600x1200/bg-10.png') }}');">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="signupForm" method="post" action="/signup">
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">🚀 Team Project 회원가입</h3>
        <div class="flex justify-center font-medium">
          <span class="text-sm text-secondary-foreground me-1.5">이미 계정이 있으신가요?</span>
          <a class="text-sm link" href="/login">로그인하기</a>
        </div>
      </div>

      <!-- 알림 컨테이너 -->
      <div id="alertContainer" class="hidden"></div>

      <!-- 사용자명 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">사용자명 *</label>
        <input class="kt-input" id="username" name="username" placeholder="johndoe123" type="text" required/>
        <span class="text-xs text-muted-foreground">영문으로 시작하는 3-50자 (영문, 숫자, 언더스코어만 가능)</span>
      </div>

      <!-- 이메일 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">이메일 *</label>
        <input class="kt-input" id="email" name="email" placeholder="email@example.com" type="email" required/>
      </div>

      <!-- 비밀번호 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">비밀번호 *</label>
        <div class="kt-input" data-kt-toggle-password="true">
          <input id="password" name="password" placeholder="비밀번호를 입력하세요" type="password" required/>
          <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon" data-kt-toggle-password-trigger="true" type="button">
            <span class="kt-toggle-password-active:hidden">
              <i class="ki-filled ki-eye text-muted-foreground"></i>
            </span>
            <span class="hidden kt-toggle-password-active:block">
              <i class="ki-filled ki-eye-slash text-muted-foreground"></i>
            </span>
          </button>
        </div>
        
        <!-- 비밀번호 요구사항 -->
        <div class="mt-2 p-3 bg-muted/20 rounded-lg border border-border">
          <span class="text-xs text-muted-foreground font-medium">비밀번호 요구사항:</span>
          <div class="grid grid-cols-1 gap-1 mt-2">
            <div class="requirement flex items-center text-xs text-muted-foreground" id="req-length">
              <span class="icon text-green-600 me-2">✗</span> 8자 이상
            </div>
            <div class="requirement flex items-center text-xs text-muted-foreground" id="req-upper">
              <span class="icon text-green-600 me-2">✗</span> 대문자 포함
            </div>
            <div class="requirement flex items-center text-xs text-muted-foreground" id="req-lower">
              <span class="icon text-green-600 me-2">✗</span> 소문자 포함
            </div>
            <div class="requirement flex items-center text-xs text-muted-foreground" id="req-digit">
              <span class="icon text-green-600 me-2">✗</span> 숫자 포함
            </div>
            <div class="requirement flex items-center text-xs text-muted-foreground" id="req-special">
              <span class="icon text-green-600 me-2">✗</span> 특수문자 포함
            </div>
          </div>
        </div>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">비밀번호 확인 *</label>
        <div class="kt-input" data-kt-toggle-password="true">
          <input id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" type="password" required/>
          <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon" data-kt-toggle-password-trigger="true" type="button">
            <span class="kt-toggle-password-active:hidden">
              <i class="ki-filled ki-eye text-muted-foreground"></i>
            </span>
            <span class="hidden kt-toggle-password-active:block">
              <i class="ki-filled ki-eye-slash text-muted-foreground"></i>
            </span>
          </button>
        </div>
        <div id="passwordMatchMessage" class="text-xs mt-1"></div>
      </div>

      <!-- 실명 (선택사항) -->
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">실명 (선택사항)</label>
        <input class="kt-input" id="name" name="name" placeholder="김철수" type="text"/>
        <span class="text-xs text-muted-foreground">실명을 입력하시면 더 개인화된 서비스를 받을 수 있습니다</span>
      </div>

      <!-- 약관 동의 -->
      <label class="kt-label">
        <input class="kt-checkbox kt-checkbox-sm" id="agreeTerms" name="agreeTerms" type="checkbox" required/>
        <span class="kt-checkbox-label">
          <a href="#" class="link" onclick="showTerms()">이용약관</a> 및 
          <a href="#" class="link" onclick="showPrivacy()">개인정보처리방침</a>에 동의합니다
        </span>
      </label>

      <!-- 회원가입 버튼 -->
      <button class="kt-btn kt-btn-primary flex justify-center grow" id="submitBtn" type="submit">
        <span id="submitText">회원가입</span>
        <span id="submitLoading" class="hidden">
          <i class="ki-filled ki-spinner animate-spin me-2"></i>처리 중...
        </span>
      </button>
    </form>
  </div>
</div>

<script>
// 비밀번호 유효성 검사
function validatePassword(password) {
    const requirements = {
        length: password.length >= 8,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        digit: /\d/.test(password),
        special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
    };

    // UI 업데이트
    Object.keys(requirements).forEach(req => {
        const element = document.getElementById(`req-${req}`);
        const icon = element.querySelector('.icon');
        if (requirements[req]) {
            icon.textContent = '✓';
            icon.classList.remove('text-red-500');
            icon.classList.add('text-green-600');
            element.classList.remove('text-muted-foreground');
            element.classList.add('text-green-600');
        } else {
            icon.textContent = '✗';
            icon.classList.remove('text-green-600');
            icon.classList.add('text-red-500');
            element.classList.remove('text-green-600');
            element.classList.add('text-muted-foreground');
        }
    });

    return Object.values(requirements).every(Boolean);
}

// 비밀번호 확인
function checkPasswordMatch() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const messageElement = document.getElementById('passwordMatchMessage');

    if (!confirmPassword) {
        messageElement.textContent = '';
        messageElement.className = 'text-xs mt-1';
        return;
    }

    if (password === confirmPassword) {
        messageElement.textContent = '✓ 비밀번호가 일치합니다';
        messageElement.className = 'text-xs mt-1 text-green-600';
        return true;
    } else {
        messageElement.textContent = '✗ 비밀번호가 일치하지 않습니다';
        messageElement.className = 'text-xs mt-1 text-red-500';
        return false;
    }
}

// 이벤트 리스너
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('password').addEventListener('input', function() {
        validatePassword(this.value);
        checkPasswordMatch();
    });

    document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

    // 폼 제출
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!validatePassword(password)) {
            showAlert('비밀번호 요구사항을 모두 만족해주세요.', 'error');
            return;
        }
        
        if (!checkPasswordMatch()) {
            showAlert('비밀번호가 일치하지 않습니다.', 'error');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitLoading = document.getElementById('submitLoading');

        submitBtn.disabled = true;
        submitText.classList.add('hidden');
        submitLoading.classList.remove('hidden');

        // 폼 데이터 수집
        const formData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: password,
            name: document.getElementById('name').value || null
        };

        try {
            // 실제 API 호출
            const response = await fetch('/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok) {
                // 회원가입 성공
                showAlert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.', 'success');
                
                // 토큰이 반환되면 로컬 스토리지에 저장 (선택사항)
                if (result.access_token) {
                    localStorage.setItem('access_token', result.access_token);
                    localStorage.setItem('refresh_token', result.refresh_token);
                }
                
                // 2초 후 로그인 페이지로 리다이렉트
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
                
            } else {
                // 회원가입 실패
                let errorMessage = '회원가입에 실패했습니다.';
                
                if (result.detail) {
                    if (typeof result.detail === 'string') {
                        errorMessage = result.detail;
                    } else if (result.detail.message) {
                        errorMessage = result.detail.message;
                        
                        // 비밀번호 요구사항이 있다면 표시
                        if (result.detail.requirements) {
                            console.log('비밀번호 요구사항:', result.detail.requirements);
                        }
                    }
                }
                
                showAlert(errorMessage, 'error');
            }
            
        } catch (error) {
            console.error('회원가입 요청 오류:', error);
            showAlert('네트워크 오류가 발생했습니다. 다시 시도해주세요.', 'error');
        } finally {
            // 버튼 상태 복원
            submitBtn.disabled = false;
            submitText.classList.remove('hidden');
            submitLoading.classList.add('hidden');
        }
    });
});

// 알림 표시 함수
function showAlert(message, type) {
    const alertContainer = document.getElementById('alertContainer');
    const alertClass = type === 'error' ? 'kt-alert-danger' : 'kt-alert-success';
    
    alertContainer.innerHTML = `
        <div class="kt-alert ${alertClass} flex items-center gap-2 p-3 rounded-lg">
            <i class="ki-filled ${type === 'error' ? 'ki-information-2' : 'ki-check'} text-sm"></i>
            <span class="text-sm">${message}</span>
        </div>
    `;
    alertContainer.classList.remove('hidden');
    
    setTimeout(() => {
        alertContainer.classList.add('hidden');
    }, 5000);
}

// 약관 모달 (임시)
function showTerms() {
    alert('이용약관 내용이 여기에 표시됩니다.');
}

function showPrivacy() {
    alert('개인정보처리방침 내용이 여기에 표시됩니다.');
}
</script>
{% endblock %}
