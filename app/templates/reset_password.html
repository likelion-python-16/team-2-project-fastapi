{% extends "final.html" %}
{% block title %}비밀번호 찾기 - Team Project{% endblock %}

{% block content %}
<div id="pageBg" class="flex items-center justify-center grow bg-center bg-no-repeat page-bg">
  <div class="kt-card max-w-[420px] w-full">
    <div class="kt-card-content flex flex-col gap-5 p-10">
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono leading-none mb-2.5">비밀번호 찾기</h3>
        <div class="text-sm text-muted-foreground">
          회원가입시 입력한 정보를 모두 정확히 입력해주세요
        </div>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <form id="resetPasswordForm" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label class="kt-form-label font-normal text-mono">아이디</label>
          <input class="kt-input" id="username" name="username" placeholder="사용자명 입력" required />
        </div>

        <div class="flex flex-col gap-1">
          <label class="kt-form-label font-normal text-mono">이름</label>
          <input class="kt-input" id="name" name="name" placeholder="실명 입력" required />
        </div>

        <div class="flex flex-col gap-1">
          <label class="kt-form-label font-normal text-mono">주민등록번호</label>
          <input class="kt-input" id="identification_number" name="identification_number" placeholder="주민등록번호 13자리" maxlength="13" required />
        </div>

        <div class="flex flex-col gap-1">
          <label class="kt-form-label font-normal text-mono">이메일</label>
          <input class="kt-input" id="email" name="email" type="email" placeholder="이메일 주소" required />
        </div>

        <button type="submit" class="kt-btn kt-btn-primary justify-center">
          <span id="btnText">비밀번호 재설정 이메일 발송</span>
          <div id="loadingSpinner" class="hidden size-4 animate-spin border-2 border-current border-t-transparent rounded-full"></div>
        </button>
      </form>

      <div class="text-center">
        <a class="kt-link text-sm" href="/login">로그인으로 돌아가기</a>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('resetPasswordForm');
  const alertContainer = document.getElementById('alertContainer');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('loadingSpinner');

  function showAlert(message, type = 'error') {
    alertContainer.className = `kt-alert kt-alert-${type}`;
    alertContainer.textContent = message;
    alertContainer.classList.remove('hidden');
  }

  function hideAlert() {
    alertContainer.classList.add('hidden');
  }

  function setLoading(loading) {
    if (loading) {
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      form.querySelector('button').disabled = true;
    } else {
      btnText.classList.remove('hidden');
      spinner.classList.add('hidden');
      form.querySelector('button').disabled = false;
    }
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();
    setLoading(true);

    const formData = new FormData(form);
    const data = Object.fromEntries(formData);

    try {
      const response = await fetch('/api/v1/auth/request-password-reset', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (response.ok) {
        showAlert(result.message || '비밀번호 재설정 이메일이 발송되었습니다. 이메일을 확인해주세요.', 'success');
        form.reset();
      } else {
        showAlert(result.detail || result.message || '요청 처리 중 오류가 발생했습니다.');
      }
    } catch (error) {
      showAlert('네트워크 오류가 발생했습니다. 다시 시도해주세요.');
    } finally {
      setLoading(false);
    }
  });

  // 주민등록번호 숫자만 입력
  document.getElementById('identification_number').addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });
});
</script>
{% endblock %}
