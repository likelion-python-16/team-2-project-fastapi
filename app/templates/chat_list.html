<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채팅방</title>
  <style>
    body{margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    a{text-decoration:none}
    .container{max-width:840px; margin:0 auto; padding:16px}
    .header{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee}
    .header a{ text-decoration:none; color:inherit }
    .room{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border:1px solid #e5e7eb; border-radius:14px; margin:12px 0; background:#fff; transition:box-shadow .15s ease, border-color .15s ease}
    .room:hover{box-shadow:0 8px 24px rgba(0,0,0,.06); border-color:#d1d5db}
    .title{font-weight:800; font-size:16px}
    .title a{color:#111827}
    .muted{color:#6b7280; font-size:12px}
    .badge{background:#ef4444; color:#fff; border-radius:999px; padding:2px 8px; font-size:12px}
    .list{margin-top:12px}
    .enter-btn{display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:#4338CA; color:#fff; border-radius:10px; border:1px solid #4338CA; font-weight:700}
    .enter-btn:hover{background:#3730a3; border-color:#3730a3}
  </style>
  <script>
    function token(){ try{ return localStorage.getItem('access_token') || sessionStorage.getItem('access_token') || null; }catch{ return null; } }
    async function jget(url){ const h={}; const t=token(); if(t) h['Authorization']='Bearer '+t; const r=await fetch(url,{headers:h, credentials:'include'}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j?.detail||j?.message||('HTTP '+r.status)); return j; }
    document.addEventListener('DOMContentLoaded', async ()=>{
      const list = document.getElementById('list');
      try{
        const res = await jget('/api/v1/chat/rooms');
        const items = res.items||[];
        if(items.length===0){ list.innerHTML = '<div class="muted">채팅방이 없습니다.</div>'; return; }
        // 상대 닉네임을 title로 사용 (필요 시 병렬 요청)
        const metas = await Promise.all(items.map(r=> jget(`/api/v1/chat/rooms/${r.id}/meta`).catch(()=>null)));
        list.innerHTML = items.map((r,i)=>{
          const last = r.last_message_at? new Date(r.last_message_at).toLocaleString('ko-KR'): '-';
          const unread = r.unread||0;
          const partner = metas[i]?.other;
          const uname = partner?.username || '알 수 없음';
          const uid = partner?.id;
          const title = `<a class="title-link" href="${uid?('/users/'+uid):'#'}">${uname}</a>님과의 채팅`;
          return `<div class="room"><div><div class="title">${title}</div><div class="muted">마지막: ${last}</div></div><div style="display:flex;align-items:center;gap:8px">${unread>0?`<span class=badge>${unread}</span>`:''} <a class="enter-btn" href="/chat/rooms/${r.id}">채팅방 입장하기</a></div></div>`;
        }).join('');
      }catch(e){ list.innerHTML = '<div class="muted">로드 실패: '+(e?.message||e)+'</div>'; }
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/home">🏠</a>
      <h2 style="margin:0">내 채팅</h2>
      <div style="flex:1"></div>
    </div>
    <div id="list" class="list"></div>
  </div>
</body>
</html>
