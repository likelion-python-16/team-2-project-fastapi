<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>지도 선택</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",Arial;margin:0}
    #topbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
    #map{width:100%;height:58vh}
    #result{padding:10px;border-top:1px solid #eee;line-height:1.5}
    input[type="text"]{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px}
    button{padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fafafa;cursor:pointer}
    button:hover{background:#f0f0f0}
    .row{display:flex;gap:8px;margin-top:8px}
    .label{width:130px;color:#666}
    .val{flex:1;word-break:break-all}
    /* 검색 결과 드롭다운 */
    #searchResults{
      position:absolute; left:10px; right:10px; top:56px;
      background:#fff; border:1px solid #ddd; border-radius:8px;
      max-height:38vh; overflow:auto; display:none; z-index:20;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }
    #searchResults .item{padding:10px 12px; border-bottom:1px solid #f2f2f2; cursor:pointer}
    #searchResults .item:hover{background:#f7f7f7}
    #searchResults .title{font-weight:600}
    #searchResults .sub{font-size:12px; color:#666; margin-top:2px}
  </style>
  <!-- JS API v3 + 지오코더 서브모듈 -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ ncpKeyId }}&submodules=geocoder"></script>
</head>
<body>
  <div id="topbar">
    <input id="address" type="text" placeholder="주소/장소명 입력 후 엔터 또는 [검색]" />
    <button id="btnSearch">검색</button>
    <button id="btnConfirm">확인</button>
  </div>

  <!-- 키워드 결과 -->
  <div id="searchResults"></div>

  <!-- ★ 변경: 주변 추천 → 우측 사이드 패널(28~32%), 접기/펼침 토글 -->
  <style>
    #nearbyBox{
      position: fixed;
      top: 64px; right: 10px; bottom: 10px;
      width: clamp(300px, 30%, 420px);
      background:#fff; border:1px solid #ddd; border-radius:10px;
      display:none; z-index:10000; overflow:auto;
      box-shadow:0 8px 24px rgba(0,0,0,.12)
    }
    #nearbyHeader{position:sticky; top:0; background:#fff; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid #eee;}
    #nearbyHeader .title{font-weight:600}
    #nearbyClose{border:1px solid #ddd; background:#f7f7f7; border-radius:6px; padding:4px 8px; cursor:pointer}
    #nearbyOpenBtn{position:fixed; right:10px; top:64px; z-index:9999; display:none; border:1px solid #ddd; background:#fff; border-radius:999px; padding:8px 12px; box-shadow:0 6px 20px rgba(0,0,0,.12); cursor:pointer}
  </style>
  <button id="nearbyOpenBtn" type="button">추천 열기</button>
  <div id="nearbyBox"></div>

  <div id="map"></div>

  <div id="result">
    <div class="row"><div class="label">좌표</div><div class="val" id="coord">-</div></div>
    <div class="row"><div class="label">도로명</div><div class="val" id="roadAddr">-</div></div>
    <div class="row"><div class="label">지번</div><div class="val" id="jibunAddr">-</div></div>
    <div class="row"><div class="label">선택장소명</div><div class="val" id="placeName">-</div></div>
    <div class="row"><div class="label">네이버맵링크</div><div class="val" id="mapUrl">-</div></div>
  </div>

<script>
let map, marker;

// 선택 결과
let picked = {
  lat: null,
  lng: null,
  roadAddress: "",
  jibunAddress: "",
  placeName: "",
  mapUrl: "",
  placeId: null            // ✅ placeId 초기화
};

function makeNaverMapUrl(lat, lng, title){
  const lvl = 15;
  if (lat != null && lng != null) return `https://map.naver.com/v5/?c=${lng},${lat},${lvl},0,0,0,dh`;
  const q = encodeURIComponent((title||"").trim());
  return `https://map.naver.com/v5/search/${q}`;
}

function joinAddress(item){
  const r = item.region || {}, l = item.land || {};
  const parts = [
    r.area1?.name, r.area2?.name, r.area3?.name, r.area4?.name,
    l.name, l.number1 ? (l.number2 ? `${l.number1}-${l.number2}` : l.number1) : ""
  ].filter(Boolean);
  return parts.join(" ");
}

function renderPicked(){
  document.getElementById("coord").textContent =
    (picked.lat!=null && picked.lng!=null) ? `${picked.lat}, ${picked.lng}` : "-";
  document.getElementById("roadAddr").textContent = picked.roadAddress || "-";
  document.getElementById("jibunAddr").textContent = picked.jibunAddress || "-";
  document.getElementById("placeName").textContent = picked.placeName || "-";
  document.getElementById("mapUrl").innerHTML =
    picked.mapUrl ? `<a href="${picked.mapUrl}" target="_blank" rel="noopener">${picked.mapUrl}</a>` : "-";
}

/* ========= 검색 유틸 ========= */

// 주소 지오코딩
function geocodeAddress(address){
  return new Promise((resolve, reject)=>{
    naver.maps.Service.geocode({ query: address }, function(status, resp){
      if (status !== naver.maps.Service.Status.OK) return resolve(null);
      const addr = resp?.v2?.addresses?.[0];
      if (!addr) return resolve(null);
      resolve({
        lat: parseFloat(addr.y),
        lng: parseFloat(addr.x),
        roadAddress: addr.roadAddress || "",
        jibunAddress: addr.jibunAddress || ""
      });
    });
  });
}

// 로컬(POI) 검색: /places/search → 실패 시 /naver/local
async function localSearch(query){
  try{
    const r1 = await fetch(`/places/search?query=${encodeURIComponent(query)}&limit=10`);
    if (r1.ok){
      const d = await r1.json();
      if (d?.items?.length) return d.items;
    }
  }catch(e){ console.debug("localSearch /places/search error", e); }

  try{
    const r2 = await fetch(`/naver/local?q=${encodeURIComponent(query)}&display=10&start=1`);
    if (r2.ok){
      const d = await r2.json();
      if (d?.items?.length) return d.items;
    }
  }catch(e){ console.debug("localSearch /naver/local error", e); }

  return [];
}

/* ========= 검색 UI ========= */

const $results = document.getElementById("searchResults");

function hideResults(){ $results.style.display = "none"; $results.innerHTML = ""; }

function showResults(items){
  if (!items.length){ hideResults(); return; }
  $results.innerHTML = items.map((it, i)=>{
    const title = (it.name||"").replace(/<[^>]+>/g, "");
    const road = it.roadAddress || "";
    const addr = it.address || "";
    return `<div class="item" data-idx="${i}">
      <div class="title">${title||"(제목없음)"}</div>
      <div class="sub">${road || addr || ""}</div>
    </div>`;
  }).join("");
  $results.style.display = "block";

  Array.from($results.querySelectorAll(".item")).forEach(el=>{
    el.addEventListener("click", async ()=>{
      const idx = Number(el.getAttribute("data-idx"));
      const it = items[idx];
      const title = (it.name||"").replace(/<[^>]+>/g, "");
      const road = it.roadAddress || "";
      const addr = it.address || "";

      const q = road || addr || title;
      let geo = null;
      if (q) geo = await geocodeAddress(q);
      if (!geo){
        alert("좌표를 찾지 못했습니다. 다른 검색어를 시도해 주세요.");
        return;
      }

      const {lat, lng, roadAddress, jibunAddress} = geo;
      const pt = new naver.maps.Point(lng, lat);
      map.setCenter(pt);
      map.setZoom(15, true);
      marker.setPosition(pt);

      picked.lat = lat;
      picked.lng = lng;
      picked.roadAddress = roadAddress || road || "";
      picked.jibunAddress = jibunAddress || addr || "";
      picked.placeName = title || "선택 위치";
      picked.mapUrl = makeNaverMapUrl(lat, lng, picked.placeName);
      picked.placeId = null;
      renderPicked();
      hideResults();

      fetchNearby(lat, lng, picked.placeName || picked.roadAddress || picked.jibunAddress || "");
    });
  });
}

// 주소/키워드 스마트 검색
async function smartSearch(q){
  hideResults();
  hideNearby(); // ★ 변경: 새 검색 시작 시 이전 추천 패널 닫기

  try{
    const g = await geocodeAddress(q);
    if (g){
      const {lat,lng,roadAddress,jibunAddress} = g;
      const pt = new naver.maps.Point(lng, lat);
      map.setCenter(pt);
      map.setZoom(15, true);
      marker.setPosition(pt);

      picked.lat = lat;
      picked.lng = lng;
      picked.roadAddress = roadAddress;
      picked.jibunAddress = jibunAddress;
      picked.placeName = q.trim();
      picked.mapUrl = makeNaverMapUrl(lat, lng, picked.placeName);
      picked.placeId = null;
      renderPicked();

      fetchNearby(lat, lng, picked.placeName || picked.roadAddress || picked.jibunAddress || "");
      return;
    }
  }catch(e){ console.error("geocodeAddress error:", e); }

  try{
    const items = await localSearch(q);
    if (!items.length){
      alert("검색 결과가 없습니다. 대신 현재 지도의 근처 장소를 추천해 드릴게요.");
      const c = map.getCenter();
      fetchNearby(c.y, c.x, q);
      return;
    }
    showResults(items);
  }catch(e){
    console.error("localSearch error:", e);
    alert("검색 중 오류가 발생했습니다. 콘솔 로그를 확인해 주세요.");
  }
}

/* ========= 지도/이벤트 ========= */

function searchCoordinateToAddress(latlng){
  naver.maps.Service.reverseGeocode({
    coords: latlng,
    orders: [naver.maps.Service.OrderType.ROAD_ADDR, naver.maps.Service.OrderType.ADDR].join(",")
  }, function(status, resp){
    if (status !== naver.maps.Service.Status.OK) { alert("리버스 지오코딩 실패"); return; }
    const results = resp.v2?.results || [];
    const road = results.find(x => x.name === "roadaddr");
    const jibun = results.find(x => x.name === "addr");

    picked.lat = latlng.y;
    picked.lng = latlng.x;
    picked.roadAddress = road ? joinAddress(road) : "";
    picked.jibunAddress = jibun ? joinAddress(jibun) : "";
    picked.placeName = "";
    picked.mapUrl = makeNaverMapUrl(picked.lat, picked.lng, "선택 위치");
    picked.placeId = null;
    renderPicked();

    fetchNearby(picked.lat, picked.lng, picked.placeName || picked.roadAddress || picked.jibunAddress || "");
    return;
  });
}

function initMap(){
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: 13,
    zoomControl: true
  });
  marker = new naver.maps.Marker({ position: map.getCenter(), map });

  const $addr = document.getElementById("address");

  document.getElementById("btnSearch").addEventListener("click", ()=>{
    const v = $addr.value.trim(); if (v) smartSearch(v);
  });
  $addr.addEventListener("keydown", (e)=>{
    if (e.key === "Enter"){
      const v = $addr.value.trim(); if (v) smartSearch(v);
    }
  });

  naver.maps.Event.addListener(map, "click", (e)=>{
    marker.setPosition(e.coord);
    hideResults();
    hideNearby(); // ★ 변경: 지도 찍을 때 이전 추천 패널 닫기(새로 띄울 예정)
    searchCoordinateToAddress(e.coord);
  });

  document.getElementById("btnConfirm").addEventListener("click", ()=>{
    if (picked.lat==null || picked.lng==null){
      alert("먼저 지도에서 위치를 선택하세요.");
      return;
    }
    if (!picked.placeName){
      const ok = confirm("정확한 장소명이 없어 링크가 부정확할 수 있어요.\n그래도 현재 좌표로 진행할까요? (추천 목록을 보고 싶으면 [취소] 후 상단 목록에서 선택)" );
      if (!ok){
        fetchNearby(picked.lat, picked.lng, picked.roadAddress || picked.jibunAddress || "");
        window.scrollTo({top: 0, behavior: "smooth"});
        return;
      }
      picked.placeName = "선택 위치";
      picked.mapUrl = makeNaverMapUrl(picked.lat, picked.lng, picked.placeName);
    }
    window.opener?.postMessage({
      type: "placePicked",
      title: picked.placeName || "선택 위치",
      road: picked.roadAddress,
      addr: picked.jibunAddress,
      lat: picked.lat,
      lng: picked.lng,
      link: picked.mapUrl,
      placeId: picked.placeId || null
    }, "*");
    window.close();
  });

  // ★ 변경: 추천 박스를 클릭해도 닫히지 않도록 처리
  document.addEventListener("click", (e)=>{
    const inTopbar = e.target.closest("#topbar");
    const inResults = e.target.closest("#searchResults");
    const inNearby  = e.target.closest("#nearbyBox"); // ★ 변경
    if (!inTopbar && !inResults){ hideResults(); }
    // nearby는 의도적으로 자동 닫지 않음 (선택 시 내부에서만 닫힘)
    if (!inTopbar && !inResults && !inNearby){
      // 필요 시 여기서 hideNearby()를 호출하도록 바꿀 수 있음
    }
  });
}

// JS 로드 완료되면 초기화
naver.maps.onJSContentLoaded = initMap;

window.navermap_authFailure = function(){
  alert("네이버 지도 인증 실패: ncpKeyId(NAVER_MAPS_CLIENT_ID)가 올바른지 확인하세요.");
};

/* ========= 주변 장소 추천 (우측 패널) ========= */
const $nearby = document.getElementById("nearbyBox");
const $nearbyOpen = document.getElementById("nearbyOpenBtn");

function hideNearby(){ $nearby.style.display = "none"; $nearby.innerHTML = ""; $nearbyOpen.style.display='inline-block'; }
function showNearby(){ $nearby.style.display = "block"; $nearbyOpen.style.display='none'; }

function renderNearby(list, lat, lng, emptyMsg){
  if (!list || !list.length){
    $nearby.innerHTML = `
      <div id="nearbyHeader"><div class="title">주변 장소 추천</div><button id="nearbyClose" type="button">접기</button></div>
      <div style="padding:10px 12px; color:#666">${emptyMsg || '주변 추천 결과가 없습니다.'}</div>`;
    showNearby();
    document.getElementById('nearbyClose')?.addEventListener('click', hideNearby);
    return;
  }
  $nearby.innerHTML = `
    <div id="nearbyHeader"><div class="title">주변 장소 추천</div><button id="nearbyClose" type="button">접기</button></div>
    ${list.map((it, i)=>`
      <div class="item" data-idx="${i}" style="padding:10px 12px; border-bottom:1px solid #f2f2f2; cursor:pointer">
        <div style="font-weight:600">${(it.title||it.name||"").replace(/<[^>]+>/g,"")}</div>
        <div style="font-size:12px; color:#666">${it.roadAddress || it.road_address || it.address || ""}</div>
      </div>`).join("")}
  `;
  showNearby();
  document.getElementById('nearbyClose')?.addEventListener('click', hideNearby);

  Array.from($nearby.querySelectorAll(".item")).forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = Number(el.getAttribute("data-idx"));
      const it = list[idx];
      picked.placeName = (it.title || "선택 위치").replace(/<[^>]+>/g,"");
      picked.mapUrl = it.link || picked.mapUrl;
      picked.placeId = it.placeId || null;
      renderPicked();
      hideNearby();
    });
  });
}

async function fetchNearby(lat, lng, q=""){
  try{
    const url = `/naver/nearby?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}&limit=10${q?`&q=${encodeURIComponent(q)}`:""}`;
    const resp = await fetch(url);
    if (!resp.ok){ renderNearby([], lat, lng, '주변 추천 API 호출 실패'); return; }
    const data = await resp.json();
    let items = data.items || [];
    // 폴백: 주변 추천이 비어 있으면 네이버 로컬 검색으로 대체
    if (!items.length && q){
      try{
        const r2 = await fetch(`/naver/local?q=${encodeURIComponent(q)}&display=10`);
        if (r2.ok){
          const j2 = await r2.json();
          items = (j2.items||[]).map(it=>({
            title: it.name || '',
            roadAddress: it.roadAddress || '',
            address: it.address || '',
            placeId: null,
            link: it.map_url || ''
          }));
        }
      }catch(_e){}
    }
    renderNearby(items, lat, lng);
  }catch(e){
    renderNearby([], lat, lng, '주변 추천 로딩 실패');
  }
}

$nearbyOpen.addEventListener('click', ()=>{ showNearby(); });
</script>
</body>
</html>
