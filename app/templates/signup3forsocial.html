{% extends "final.html" %}
{% block title %}소셜 회원가입 3단계 - Team Project{% endblock %}
{% block content %}
<style> body { flex-direction: column; } </style>
<div class="flex items-center justify-center grow">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="socialStep3" method="post" novalidate>
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">소셜 회원가입 · 3단계</h3>
        <div class="text-sm text-muted-foreground">프로필을 마지막으로 확인해요</div>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">프로필 이미지</label>
        <div class="flex items-center gap-3">
          <div class="avatar-wrap">
            <img id="profilePreview" alt="프로필 미리보기" referrerpolicy="no-referrer">
            <div id="defaultAvatar" class="avatar-fallback-initials" style="display:none"></div>
          </div>
          <div class="flex-1 space-y-2">
            <input class="kt-input" id="profile_image" name="profile_image" placeholder="https://example.com/image.jpg 또는 /static/pictures/xxx.jpg" type="url">
            <div class="flex items-center gap-2">
              <input id="profile_file" type="file" accept="image/*" class="hidden">
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnPick">파일 선택</button>
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnUpload">업로드</button>
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnDefault">기본 아바타</button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">자기소개</label>
        <textarea class="kt-input" id="introduction" name="introduction" placeholder="안녕하세요!" rows="4" maxlength="500"></textarea>
        <div class="flex justify-between items-center">
          <span class="text-xs text-muted-foreground">다른 사용자들에게 보여질 소개글입니다</span>
          <span class="text-xs text-muted-foreground" id="charCount">0/500</span>
        </div>
      </div>

      <!-- 관심사(카테고리) 선택 -->
      <div class="flex flex-col gap-2">
        <label class="kt-form-label">관심사(카테고리) 선택</label>
        <div class="text-[11px] text-muted-foreground">최대 10개까지 선택할 수 있어요.</div>

        <div id="selectedTags" class="flex flex-wrap gap-2"></div>

        <div id="tagList" class="flex flex-wrap gap-2 max-h-56 overflow-auto border border-border rounded-md p-2">
          <span id="tagLoading" class="text-xs text-muted-foreground">로딩 중...</span>
        </div>
      </div>

      <div class="flex gap-3">
        <a class="kt-btn kt-btn-light grow" id="btnPrev" href="/signup/social/step2">이전 단계</a>
        <button class="kt-btn kt-btn-primary grow" id="submitBtn" type="submit">
          <span id="submitText">가입 완료</span>
          <span id="submitLoading" class="hidden"><i class="ki-filled ki-spinner animate-spin me-2"></i>처리 중...</span>
        </button>
      </div>

      <div class="text-center text-xs text-muted-foreground mt-2">
        💡 나중에 프로필에서 언제든 수정할 수 있습니다<br>
        <a href="#" id="linkSkip" class="text-primary font-medium">나중에 설정</a>
      </div>
    </form>
  </div>
</div>

<script>
const KEY='signupSocialDraft';
function getDraft(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}} }
function saveDraft(d){ localStorage.setItem(KEY, JSON.stringify(d||{})); }
function clearDraft(){ localStorage.removeItem(KEY); }
function showAlert(msg,type){ var el=document.getElementById('alertContainer'); var css=type==='error'?'kt-alert-danger':'kt-alert-success'; el.innerHTML='<div class="kt-alert '+css+' p-3 rounded-lg flex items-center gap-2"><i class="ki-filled '+(type==='error'?'ki-information-2':'ki-check')+'"></i><span class="text-sm">'+msg+'</span></div>'; el.classList.remove('hidden'); }

const DEFAULT_AVATAR='/static/pictures/defaultprofile.svg';
let SOCIAL_BASE_NAME='';
function computeInitials(base){ const s=String(base||'').trim(); if(!s) return '?'; const arr=[...s]; return arr.slice(Math.max(0,arr.length-2)).join(''); }
function updateProfilePreview(url){
  const img=document.getElementById('profilePreview');
  const icon=document.getElementById('defaultAvatar');
  const showImg=()=>{icon.style.display='none';img.style.display='block'};
  const showIcon=()=>{img.style.display='none'; icon.textContent=computeInitials(SOCIAL_BASE_NAME); icon.style.display='flex'};
  if(!url){ img.removeAttribute('src'); showIcon(); return; }
  img.referrerPolicy='no-referrer';
  img.onload=()=>{ showImg(); };
  img.onerror=()=>{ showIcon(); };
  img.src=url;
  if(img.complete && img.naturalWidth>0) showImg();
}
async function uploadFileToServer(file, btn){ if(!file){ showAlert('먼저 파일을 선택해 주세요.','error'); return null; } const fd=new FormData(); fd.append('file', file); const old=btn.textContent; btn.disabled=true; btn.textContent='업로드 중...'; try{ const res=await fetch('/api/v1/files/profile-image',{method:'POST', body:fd}); const j=await res.json(); if(!res.ok||!j?.url) throw new Error(j?.detail||'업로드 실패'); showAlert('업로드 완료!','success'); return j.url; }catch(e){ showAlert(String(e?.message||e),'error'); return null; }finally{ btn.disabled=false; btn.textContent=old; } }

// ===== 카테고리(태그) 선택 =====
const MAX_TAGS = 10;
let selected = new Set();

async function loadCategories(){
  const list = document.getElementById('tagList');
  const loading = document.getElementById('tagLoading');
  if (!list) return;
  try{
    // Tag 모델에 저장된 항목 중 활성 태그 17개만 사용
    const res = await fetch('/api/v1/tags/list?limit=17');
    const data = await res.json();
    const arr = Array.isArray(data?.tags) ? data.tags : (Array.isArray(data) ? data : []);
    list.innerHTML = '';
    if (!Array.isArray(arr) || arr.length === 0){
      list.innerHTML = '<span class="text-xs text-muted-foreground">표시할 태그가 없습니다.</span>';
      return;
    }
    arr.forEach(t => {
      const label = (t?.tag || '').trim();
      if (!label) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.tag = label;
      btn.className = 'px-2 py-1 rounded-full border text-xs bg-muted text-muted-foreground';
      btn.textContent = label;
      btn.addEventListener('click', ()=>{
        if (selected.has(label)) selected.delete(label);
        else {
          if (selected.size >= MAX_TAGS){ showAlert('태그는 최대 10개까지 선택할 수 있어요.','error'); return; }
          selected.add(label);
        }
        paintCategories();
        renderSelected();
      });
      list.appendChild(btn);
    });

    // 초안 복원: interests_keywords가 있으면 반영
    try{
      const d = getDraft();
      if (Array.isArray(d?.interests_keywords)) d.interests_keywords.forEach(x=> selected.add(String(x)));
    }catch(_){ }
    paintCategories();
    renderSelected();
  }catch(e){ if (loading) loading.textContent = '불러오기 실패'; }
}
function paintCategories(){
  document.querySelectorAll('#tagList button[data-tag]').forEach(b=>{
    const picked=selected.has(b.dataset.tag);
    b.className=`px-2 py-1 rounded-full border text-xs ${picked?'bg-primary text-primary-foreground':'bg-muted text-muted-foreground'}`;
  });
}
function renderSelected(){
  const hold=document.getElementById('selectedTags'); hold.innerHTML='';
  [...selected].forEach(label=>{
    const pill=document.createElement('span');
    pill.className='px-2 py-1 rounded-full border text-xs bg-primary/10 text-primary';
    pill.innerHTML=`${label} <button type="button" class="ms-1 text-primary/70" aria-label="remove">x</button>`;
    pill.querySelector('button').onclick=()=>{ selected.delete(label); paintCategories(); renderSelected(); };
    hold.appendChild(pill);
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  // Invalidate stale drafts when social session changes (provider/account swap)
  (async ()=>{
    try{
      let ident=null; try{ const r=await fetch('/api/v1/auth/identity/last', { credentials:'include' }); if(r.ok) ident=await r.json(); }catch(_){ }
      const ssk = ident && (ident.provider||ident.provider_id||ident.sub)
        ? `${ident.provider||''}:${ident.provider_id||ident.sub||''}` : '';
      const prev = localStorage.getItem('social_session_key')||'';
      if (ssk && ssk !== prev){
        try{
          localStorage.removeItem('signupSocialDraft');
          localStorage.removeItem('signupDraft');
          localStorage.removeItem('social_prefill');
          sessionStorage.removeItem('signupSocialDraft');
          sessionStorage.removeItem('signupDraft');
          sessionStorage.removeItem('social_prefill');
        }catch(_){ }
        try{ localStorage.setItem('social_session_key', ssk); }catch(_){ }
      }
      // fresh=1이면 무조건 초기화
      const qp=new URLSearchParams(location.search);
      if(qp.get('fresh')==='1'){
        try{
          localStorage.removeItem('signupSocialDraft');
          localStorage.removeItem('signupDraft');
          localStorage.removeItem('social_prefill');
          sessionStorage.removeItem('signupSocialDraft');
          sessionStorage.removeItem('signupDraft');
          sessionStorage.removeItem('social_prefill');
        }catch(_){ }
        const u=new URL(location.href); u.searchParams.delete('fresh'); history.replaceState({},'',u.toString());
      }
    }catch(_){ }
  })();
  const urlInput=document.getElementById('profile_image'); const fileInput=document.getElementById('profile_file'); const btnPick=document.getElementById('btnPick'); const btnDefault=document.getElementById('btnDefault'); const btnUpload=document.getElementById('btnUpload');
  if(!urlInput.value?.trim()) urlInput.value = DEFAULT_AVATAR; updateProfilePreview(urlInput.value.trim());

  // 소셜 사진 프리필: 세션에 picture가 있으면 기본 아바타 대신 채워넣기
  (async () => {
    try{
      const cur = (urlInput.value||'').trim();
      const isDefaultNow = !cur || cur === DEFAULT_AVATAR || /defaultprofile\.(jpe?g|png|gif|svg)$/i.test(cur);

      // 1) 세션 기반 소셜 식별 정보
      if (isDefaultNow) {
        const r = await fetch('/api/v1/auth/identity/last', { credentials: 'include' });
        if (r.ok){
          const j = await r.json();
          try{ SOCIAL_BASE_NAME = (j && (j.name || (j.email||'').split('@')[0])) || ''; }catch(_){ SOCIAL_BASE_NAME=''; }
          const pic = (j && (j.picture || j.profile_image || j.avatar_url)) ? String(j.picture || j.profile_image || j.avatar_url) : '';
          if (pic){ urlInput.value = pic; updateProfilePreview(pic); }
        }
      }

      // 2) 폴백: 로그인 사용자 프로필에서 가져오기(토큰 필요)
      const cur2 = (urlInput.value||'').trim();
      const stillDefault = !cur2 || cur2 === DEFAULT_AVATAR || /defaultprofile\.(jpe?g|png|gif|svg)$/i.test(cur2);
      if (stillDefault){
        const t = localStorage.getItem('access_token') || sessionStorage.getItem('access_token') || '';
        if (t){
          try{
            const rr = await fetch('/api/v1/users/me', { headers: { Authorization: 'Bearer '+t } });
            if (rr.ok){
              const u = await rr.json();
              try{ SOCIAL_BASE_NAME = (u && (u.name || (u.email||'').split('@')[0])) || SOCIAL_BASE_NAME; }catch(_){ }
              const pic2 = (u && (u.profile_image || u.avatar_url)) ? String(u.profile_image || u.avatar_url) : '';
              if (pic2){ urlInput.value = pic2; updateProfilePreview(pic2); }
            }
          }catch(_){ }
        }
      }
    }catch(_){ /* ignore */ }
  })();
  btnPick.addEventListener('click',()=>fileInput.click());
  btnDefault.addEventListener('click',()=>{ urlInput.value=DEFAULT_AVATAR; updateProfilePreview(DEFAULT_AVATAR); });
  fileInput.addEventListener('change', async ()=>{ const f=fileInput.files?.[0]; if(!f) return; updateProfilePreview(URL.createObjectURL(f)); const uploaded=await uploadFileToServer(f, btnUpload); if(uploaded){ urlInput.value=uploaded; updateProfilePreview(uploaded); } });
  btnUpload.addEventListener('click', async ()=>{ const f=fileInput.files?.[0]; const uploaded=await uploadFileToServer(f, btnUpload); if(uploaded){ urlInput.value=uploaded; updateProfilePreview(uploaded); } });
  document.getElementById('introduction').addEventListener('input', function(){ const c=this.value.length; document.getElementById('charCount').textContent=c+'/500'; });

  // 태그 로드
  loadCategories();

  // 이전 단계 버튼은 앵커로 이동 (기본 동작)

  // 나중에 설정: 필드 비워서 제출 (아래 링크)
  document.getElementById('linkSkip').addEventListener('click', (e)=>{
    e.preventDefault();
    document.getElementById('profile_image').value='';
    document.getElementById('introduction').value='';
    selected.clear();
    document.getElementById('socialStep3').requestSubmit();
  });

  document.getElementById('socialStep3').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const d=getDraft();
    const must = (d.phone && d.identification_number);
    if(!must){ showAlert('1단계 정보를 먼저 입력해 주세요.','error'); return; }

    // 주민번호 최종 검증 (1~8 허용)
    function isValidRRN13(n13){
      if(!/^\d{13}$/.test(n13)) return false;
      const m=parseInt(n13.slice(2,4),10), d=parseInt(n13.slice(4,6),10);
      if(!/[01]/.test(n13[2])) return false;
      if(!/[0-3]/.test(n13[4])) return false;
      if(!(m>=1&&m<=12)) return false;
      if(!(d>=1&&d<=31)) return false;
      if(!/[1-8]/.test(n13[6])) return false;
      return true;
    }
    const idRaw=String(d.identification_number||'').replace(/\D/g,'');
    if(!isValidRRN13(idRaw)){
      showAlert('주민등록번호 형식이 올바르지 않습니다. (YYMMDD-XXXXXXX, 7번째=1–8)', 'error');
      return;
    }

    const interests_keywords = [...selected];
    const intro = (document.getElementById('introduction').value||'').trim();
    const introPayload = (intro || interests_keywords.length)
      ? JSON.stringify({ bio: intro, interests: { categories: [], keywords: interests_keywords } })
      : '';
    const payload={
      phone: d.phone,
      identification_number: d.identification_number,
      name: (d.name||'').trim(),
      gender: d.gender || null,
      region_living: d.region_living || '',
      region_active: d.region_active || '',
      profile_image: (document.getElementById('profile_image').value||'').trim(),
      introduction: introPayload,
      selected_tags: [...selected],
      // 소셜 생성 지연 시 필요한 값 전달
      username: d.username || null,
      password: d.password || null,
    };

    const btn=document.getElementById('submitBtn'), txt=document.getElementById('submitText'), load=document.getElementById('submitLoading');
    btn.disabled=true; txt.classList.add('hidden'); load.classList.remove('hidden');
    try{
      const token=localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||'';
      let res, j;
      if(token){
        res=await fetch('/api/v1/users/me/onboarding',{method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+token}, body:JSON.stringify(payload)});
        j=await res.json().catch(()=>({}));
      } else {
        res=await fetch('/api/v1/auth/social/finalize',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        j=await res.json().catch(()=>({}));
        // 기존 계정이 발견되어 연동이 필요한 경우
        if(res.ok && j && j.action==='merge_required'){
          window.location.href = '/social/merge';
          return;
        }
        if(res.ok && j.access_token){
          localStorage.setItem('access_token', j.access_token);
          localStorage.setItem('refresh_token', j.refresh_token||'');
        }
      }
      if(!res.ok){
        // Pydantic 형태의 상세 오류를 친절한 메시지로 맵핑
        if (Array.isArray(j?.detail)){
          const first = j.detail[0];
          const loc = (first?.loc||[]).join('.');
          let msg = first?.msg || '유효성 검사 실패';
          if (String(loc).includes('identification_number')){
            msg = '주민등록번호 형식이 올바르지 않습니다. (YYMMDD-XXXXXXX, 7번째=1–8)';
          }
          throw new Error(msg);
        }
        throw new Error(j?.detail||j?.message||'저장 실패');
      }
      clearDraft();
      showAlert('가입이 완료되었습니다. 환영합니다!','success');
      setTimeout(()=>window.location.href='/signup/social/complete',700);
    }catch(e){ showAlert(String(e.message||e),'error'); }
    finally{ btn.disabled=false; txt.classList.remove('hidden'); load.classList.add('hidden'); }
  });
});
</script>
{% endblock %}
