{% extends "final.html" %}
{% block title %}소셜 회원가입 3단계 - Team Project{% endblock %}
{% block content %}
<div class="flex items-center justify-center grow">
  <div class="kt-card max-w-[420px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="socialStep3" method="post" novalidate>
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">소셜 회원가입 · 3단계</h3>
        <div class="text-sm text-muted-foreground">프로필을 마지막으로 확인해요</div>
      </div>

      <div id="alertContainer" class="hidden"></div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">프로필 이미지</label>
        <div class="flex items-center gap-3">
          <div class="avatar-wrap">
            <img id="profilePreview" alt="프로필 미리보기" class="w-16 h-16 rounded-full object-cover border">
            <i id="defaultAvatar" class="ki-filled ki-user avatar-fallback"></i>
          </div>
          <div class="flex-1 space-y-2">
            <input class="kt-input" id="profile_image" name="profile_image" placeholder="프로필 이미지 URL" type="url">
            <div class="flex items-center gap-2">
              <input id="profile_file" type="file" accept="image/*" class="hidden">
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnPick">파일 선택</button>
              <button type="button" class="kt-btn kt-btn-sm kt-btn-light" id="btnDefault">기본 프로필</button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label">자기소개</label>
        <textarea class="kt-input" id="introduction" name="introduction" placeholder="간단한 자기소개를 작성해주세요" rows="3"></textarea>
      </div>

      <div class="flex items-center gap-3">
        <button type="button" class="kt-btn kt-btn-outline flex-1" id="btnBack">이전</button>
        <button type="submit" class="kt-btn kt-btn-primary flex-1" id="btnComplete">
          <span id="btnText">회원가입 완료</span>
          <span id="btnLoading" class="hidden">가입 중...</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
// 이전 단계 데이터 확인
const step1Data = JSON.parse(sessionStorage.getItem('socialStep1Data') || '{}');
const step2Data = JSON.parse(sessionStorage.getItem('socialStep2Data') || '{}');

if (!step1Data.name) {
  alert('이전 단계 데이터가 없습니다');
  window.location.href = '/social/step1';
}

// 소셜 프로필 이미지 미리보기
async function loadSocialImage() {
  try {
    const response = await fetch('/api/v1/auth/identity/last');
    const data = await response.json();
    
    if (data.picture) {
      document.getElementById('profilePreview').src = data.picture;
      document.getElementById('profile_image').value = data.picture;
    }
  } catch (error) {
    console.error('소셜 이미지 로드 실패:', error);
  }
}

// 파일 선택
document.getElementById('btnPick').addEventListener('click', () => {
  document.getElementById('profile_file').click();
});

document.getElementById('profile_file').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('profilePreview').src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
});

// 기본 프로필
document.getElementById('btnDefault').addEventListener('click', () => {
  document.getElementById('profilePreview').src = '/static/pictures/defaultprofile.jpeg';
  document.getElementById('profile_image').value = '/static/pictures/defaultprofile.jpeg';
});

// 최종 회원가입
document.getElementById('socialStep3').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const btnComplete = document.getElementById('btnComplete');
  const btnText = document.getElementById('btnText');
  const btnLoading = document.getElementById('btnLoading');
  
  btnComplete.disabled = true;
  btnText.classList.add('hidden');
  btnLoading.classList.remove('hidden');
  
  try {
    // 모든 단계 데이터 합치기
    const finalData = {
      ...step1Data,
      ...step2Data,
      profile_image: document.getElementById('profile_image').value.trim(),
      introduction: document.getElementById('introduction').value.trim()
    };
    
    const response = await fetch('/api/v1/auth/social/finalize', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(finalData)
    });
    
    if (!response.ok) {
      const errorData = await response.json();
      throw new Error(errorData.detail || '회원가입에 실패했습니다');
    }
    
    const result = await response.json();
    
    // 계정 연동이 필요한 경우
    if (result.action === 'merge_required') {
      alert(result.message);
      window.location.href = '/social/merge';
      return;
    }
    
    // 일반적인 회원가입 완료
    if (result.access_token) {
      // 토큰 저장
      localStorage.setItem('access_token', result.access_token);
      localStorage.setItem('refresh_token', result.refresh_token);
      
      // 세션 스토리지 정리
      sessionStorage.removeItem('socialStep1Data');
      sessionStorage.removeItem('socialStep2Data');
      
      alert('회원가입이 완료되었습니다!');
      window.location.href = '/home';
    }
    
  } catch (error) {
    alert(error.message);
  } finally {
    btnComplete.disabled = false;
    btnText.classList.remove('hidden');
    btnLoading.classList.add('hidden');
  }
});

document.getElementById('btnBack').addEventListener('click', () => {
  window.location.href = '/social/step2';
});

// 페이지 로드시 소셜 이미지 로드
document.addEventListener('DOMContentLoaded', loadSocialImage);
</script>
{% endblock %}
