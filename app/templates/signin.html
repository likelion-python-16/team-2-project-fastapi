{% extends "final.html" %}
{% block title %}로그인 - Team Project{% endblock %}

{% block content %}
<div class="flex items-center justify-center grow bg-center bg-no-repeat page-bg" 
     style="background-image:url('{{ url_for('static', path='assets/final/media/images/2600x1200/bg-10.png') }}');">
  <div class="kt-card max-w-[370px] w-full">
    <form class="kt-card-content flex flex-col gap-5 p-10" id="sign_in_form" method="post" action="/login">
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium text-mono mb-2.5">로그인</h3>
        <div class="flex justify-center font-medium">
          <span class="text-sm text-secondary-foreground me-1.5">계정이 없으신가요?</span>
          <a class="text-sm link" href="/signup">회원가입</a>
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">이메일</label>
        <input class="kt-input" name="email" placeholder="email@example.com" type="email" required/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal text-mono">비밀번호</label>
        <div class="kt-input" data-kt-toggle-password="true">
          <input name="password" placeholder="비밀번호" type="password" required/>
          <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon" data-kt-toggle-password-trigger="true" type="button">
            <i class="ki-filled ki-eye text-muted-foreground"></i>
          </button>
        </div>
      </div>
      <label class="kt-label">
        <input class="kt-checkbox kt-checkbox-sm" type="checkbox" name="remember"/>
        <span class="kt-checkbox-label">로그인 상태 유지</span>
      </label>
      <button class="kt-btn kt-btn-primary flex justify-center grow">로그인</button>
    </form>
  </div>
</div>
{% endblock %}
