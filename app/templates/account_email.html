{% extends "final.html" %}
{% block title %}이메일 수정 - Team Project{% endblock %}
{% block content %}
<style> body { flex-direction: column; } </style>
<div class="max-w-[480px] mx-auto py-10">
  <div class="kt-card">
    <div class="kt-card-content p-8">
      <h3 class="text-lg font-medium mb-4">이메일 수정</h3>

      <div id="alertContainer" class="hidden"></div>

      <div class="flex flex-col gap-3">
        <label class="kt-form-label">아이디 또는 현재 이메일</label>
        <input class="kt-input" id="login" placeholder="아이디 또는 이메일" />

        <label class="kt-form-label">현재 비밀번호</label>
        <input class="kt-input" id="currentPassword" type="password" placeholder="현재 비밀번호" />

        <label class="kt-form-label">새 이메일</label>
        <input class="kt-input" id="newEmail" placeholder="example@domain.com" />
      </div>

      <button class="kt-btn kt-btn-primary mt-6" id="btnUpdate">이메일 변경 및 인증메일 발송</button>
    </div>
  </div>
</div>

<script>
function showAlert(message, type) {
  const el = document.getElementById('alertContainer');
  const css = type === 'error' ? 'kt-alert-danger' : 'kt-alert-success';
  el.innerHTML = `
    <div class="kt-alert ${css} p-3 rounded-lg flex items-center gap-2">
      <i class="ki-filled ${type==='error'?'ki-information-2':'ki-check'}"></i>
      <span class="text-sm">${message}</span>
    </div>`;
  el.classList.remove('hidden');
}

// 소셜 연동 계정이면 비활성화
(async function(){
  try{
    const r = await fetch('/api/v1/users/me');
    if(r.ok){
      const j = await r.json();
      if (j && (j.provider_linked || j.provider)){
        showAlert('소셜 연동 계정은 이메일을 변경할 수 없습니다.', 'error');
        ['login','currentPassword','newEmail','btnUpdate'].forEach(id=>{
          const el = document.getElementById(id); if(el) el.disabled = true;
        });
      }
    }
  }catch(_){ }
})();

document.getElementById('btnUpdate').addEventListener('click', async ()=>{
  const login = (document.getElementById('login').value||'').trim().toLowerCase();
  const current_password = (document.getElementById('currentPassword').value||'');
  const new_email = (document.getElementById('newEmail').value||'').trim().toLowerCase();

  if (!login || !current_password || !new_email) {
    showAlert('모든 항목을 입력해 주세요.', 'error'); return;
  }

  try {
    const r = await fetch('/api/v1/auth/update-email', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ login, current_password, new_email })
    });
    const j = await r.json().catch(()=> ({}));
    if (!r.ok) {
      if (r.status === 400) throw new Error(j.detail || '현재 이메일과 동일하거나 입력이 부족합니다.');
      if (r.status === 401) throw new Error('아이디/비밀번호가 올바르지 않습니다.');
      if (r.status === 409) throw new Error('이미 사용 중인 이메일입니다.');
      if (r.status === 404) throw new Error('요청 경로가 올바르지 않습니다. 관리자에게 문의하세요.');
      throw new Error(j.detail || j.message || `요청 실패 (HTTP ${r.status})`);
    }
    showAlert(j.message || '이메일이 변경되었고 인증 메일을 발송했습니다.', 'success');
    try { localStorage.setItem('last_login', login); } catch(_) {}
    setTimeout(() => {
      const q = new URLSearchParams({ email_changed: '1', sent_to: new_email });
      window.location.href = '/login?' + q.toString();
    }, 500);
  } catch (e) {
    showAlert(String(e.message || e), 'error');
  }
});
</script>
{% endblock %}
