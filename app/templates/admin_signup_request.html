{% extends "final.html" %}
{% block title %}관리자 신청 - Team Project{% endblock %}
{% block content %}
<style>
  /* 페이지 레이아웃은 세로 스택 */
  body { flex-direction: column; }
</style>

<!-- 화면 크기와 무관하게 '정가운데' 배치 -->
<div class="min-h-[100dvh] flex items-center justify-center px-4">
  <!-- 카드: 폭은 제한, 좌우 여백 대비를 위해 w-full + px-4 -->
  <div class="kt-card w-full max-w-[380px]">
    <form class="kt-card-content flex flex-col gap-5 p-8" action="/admin/signup-request" method="post">
      <div class="text-center mb-2.5">
        <h3 class="text-lg font-medium leading-none mb-2.5">관리자 신청</h3>
        <div class="text-sm text-muted-foreground">
          관리자 신청을 위해 아래 내용을 적어주세요
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal">아이디</label>
        <input class="kt-input w-full" name="username" placeholder="아이디" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal">이메일</label>
        <input class="kt-input w-full" name="email" type="email" placeholder="이메일" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal">이름</label>
        <input class="kt-input w-full" name="name" placeholder="이름" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal">비밀번호</label>
        <input class="kt-input w-full" name="password" type="password" placeholder="비밀번호" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="kt-form-label font-normal">비밀번호 확인</label>
        <input class="kt-input w-full" name="password_confirm" type="password" placeholder="비밀번호 확인" required />
      </div>

      <button class="kt-btn kt-btn-primary flex justify-center" type="submit">신청하기</button>

      <div class="text-xs text-muted-foreground text-center">
        신청 후 승인까지 시간이 걸릴 수 있습니다.
      </div>
    </form>
  </div>
</div>
{% endblock %}
