<!DOCTYPE html>
<html>
<head>
    <title>리뷰 데이터 클리어</title>
</head>
<body>
    <h1>리뷰 데이터 클리어</h1>
    <button onclick="clearReviews()">모든 리뷰 데이터 클리어</button>
    <div id="result"></div>

    <script>
    function clearReviews() {
        // localStorage 완전 클리어
        localStorage.clear();
        sessionStorage.clear();
        
        console.log('All storage cleared!');
        
        document.getElementById('result').innerHTML = 
            '<p style="color: green;">✓ 모든 브라우저 저장소 데이터가 클리어되었습니다!</p>' +
            '<p style="color: blue;">✓ 서버 데이터베이스의 리뷰도 모두 삭제되었습니다!</p>' +
            '<p><strong>이제 <a href="http://localhost:8001/api/reviews?challenge_id=1">리뷰 목록 페이지</a>로 이동해서 새로 테스트하세요.</strong></p>' +
            '<p><em>페이지를 새로고침(F5)한 후 테스트하는 것을 권장합니다.</em></p>';
    }
    </script>
</body>
</html>
