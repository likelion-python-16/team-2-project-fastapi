version: '3.8'

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:1.24
    container_name: fastteam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - fastteam-network
    restart: unless-stopped

  # FastAPI 애플리케이션 (프로덕션)
  api:
    build: 
      context: .
      dockerfile: Dockerfile.prod
      args:
        - ENV=production
    container_name: fastteam-api
    environment:
      # 환경 설정
      - ENVIRONMENT=production
      - DEBUG=False

      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET}
      - NAVER_MAPS_CLIENT_ID=${NAVER_MAPS_CLIENT_ID}
      - NAVER_MAPS_CLIENT_SECRET=${NAVER_MAPS_CLIENT_SECRET}
      
      # MySQL 설정
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      
      # 보안 관련
      - JWT_SECRET=${JWT_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-prod-session-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-prod-refresh-secret}
      
      # 소셜 로그인 설정
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_PATH=${GOOGLE_REDIRECT_PATH:-/api/v1/auth/callback/google}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_REDIRECT_PATH=${NAVER_REDIRECT_PATH:-/api/v1/auth/callback/naver}
      
      # URL 설정 (프로덕션용)
      - FRONT_BASE_URL=${FRONT_BASE_URL:-http://13.209.147.11}
      - API_BASE_URL=${API_BASE_URL:-http://13.209.147.11/api/v1}
      - VERIFICATION_LINK_BASE=${VERIFICATION_LINK_BASE:-http://13.209.147.11/api/v1}
      - VERIFY_SUCCESS_URL=${VERIFY_SUCCESS_URL:-http://13.209.147.11/verify/success}
      - VERIFY_FAIL_URL=${VERIFY_FAIL_URL:-http://localhost/verify/fail}
      
      # AWS 설정
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      
      # 토스 결제 설정
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
      
      # 초기 관리자 설정
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@fastteam.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-admin123!@#}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-FastTeam Admin}
    env_file:
      - .env.production
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 1
      --proxy-headers
      --forwarded-allow-ips="*"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/'); print('ok')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # MySQL 데이터베이스 (프로덕션)
  mysql:
    image: mysql:8.0
    container_name: fastteam-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    env_file:
      - .env.production
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./logs/mysql:/var/log/mysql
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis (캐싱 및 세션)
  redis:
    image: redis:7-alpine
    container_name: fastteam-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_123}
    volumes:
      - redis_data:/data
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: fastteam-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fastteam-network
    restart: unless-stopped
    depends_on:
      - api

  # Grafana (모니터링 대시보드)
  grafana:
    image: grafana/grafana:latest
    container_name: fastteam-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - fastteam-network
    restart: unless-stopped
    depends_on:
      - prometheus


volumes:
  mysql_prod_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  fastteam-network:
    driver: bridge