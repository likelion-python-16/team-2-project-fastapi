version: '3.8'

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:1.24
    container_name: fastteam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - fastteam-network
    restart: unless-stopped

  # FastAPI 애플리케이션 (프로덕션)
  api:
    build: 
      context: .
      args:
        - ENV=production
    container_name: fastteam-api
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DEBUG=False
      - ENVIRONMENT=production
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # MySQL 데이터베이스 (프로덕션)
  mysql:
    image: mysql:8.0
    container_name: fastteam-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    env_file:
      - .env.production
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./logs/mysql:/var/log/mysql
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis (캐싱 및 세션)
  redis:
    image: redis:7-alpine
    container_name: fastteam-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_123}
    volumes:
      - redis_data:/data
    networks:
      - fastteam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: fastteam-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fastteam-network
    restart: unless-stopped
    depends_on:
      - api

  # Grafana (모니터링 대시보드)
  grafana:
    image: grafana/grafana:latest
    container_name: fastteam-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - fastteam-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Loki (로그 수집)
  loki:
    image: grafana/loki:latest
    container_name: fastteam-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - fastteam-network
    restart: unless-stopped

  # Promtail (로그 전송)
  promtail:
    image: grafana/promtail:latest
    container_name: fastteam-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fastteam-network
    restart: unless-stopped
    depends_on:
      - loki

volumes:
  mysql_prod_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  fastteam-network:
    driver: bridge